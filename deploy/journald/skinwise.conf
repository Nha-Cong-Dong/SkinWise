# Copy to /etc/systemd/journald.conf.d/skinwise.conf, then `systemctl restart systemd-journald`.
# Not yet run on a server (the development machine has no systemd).
# uvicorn's access log (journalctl -u skinwise-api) holds visitor IPs and paths; the privacy
# policy says logs are kept at most 14 days. journald removes whole files, so files are cut
# daily and removed once older than 13 days: no entry is kept beyond 14 days.
# This applies to the whole journal of the server (journald has no per-service retention).
[Journal]
MaxFileSec=1day
MaxRetentionSec=13day
