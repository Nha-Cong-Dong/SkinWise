# Copy to /etc/nginx/snippets/skinwise-headers.conf (included by skinwise.conf).
# The app loads nothing from other origins. 'unsafe-inline' for styles: React sets a few style
# attributes. Images: data: for the label photo preview, blob: for blog photos before upload
# and in the review queue.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
