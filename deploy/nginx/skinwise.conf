# SkinWise behind nginx on one host (deploy/README.md).
# Replace skinwise.example.vn with the real domain. The certificate paths are certbot's.
#   /          the built frontend (frontend/dist, copied to /srv/skinwise/frontend)
#   /api/...   FastAPI on 127.0.0.1:8000, with the /api prefix removed (as in vite.config.ts)

# Analysis and routine checks are the heaviest API routes (each unknown ingredient line costs a
# database lookup), so they are rate limited per IP. Routine checks: a steady 30 a minute with
# bursts of 30, enough for the routine page, which checks again after every change. Above that nginx answers 429 with its
# own HTML page (not JSON). limit_req_zone belongs to the http block; this
# file is included there (sites-enabled / conf.d). Not yet run through `nginx -t`.
limit_req_zone $binary_remote_addr zone=skinwise_check:10m rate=30r/m;
# /inci/analyze has its own zone: opening a shared routine (frontend share.ts restore()) analyses
# every pasted list again, up to 50 (MAX_PRODUCTS), 4 at a time. burst=60 lets all 50 through
# at once with room for a few more; afterwards one a second.
limit_req_zone $binary_remote_addr zone=skinwise_analyze:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name skinwise.example.vn;
    # certbot answers its challenge here; everything else goes to https.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name skinwise.example.vn;

    ssl_certificate     /etc/letsencrypt/live/skinwise.example.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skinwise.example.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/skinwise/frontend;
    index index.html;

    # Label photos are sent as base64 JSON (up to ~10 MB); blog photos are 5 MB.
    client_max_body_size 11m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Security headers (snippets/skinwise-headers.conf). nginx drops the server's add_header in
    # any location that has its own, so every location below includes them again.
    include /etc/nginx/snippets/skinwise-headers.conf;

    # Hashed file names (scripts, styles, fonts): safe to cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/skinwise-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # uvicorn trusts these from 127.0.0.1 (--forwarded-allow-ips), so the per-IP limits
        # of app/accounts.py see the visitor, not nginx.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Reading a label photo waits on the AI service.
        proxy_read_timeout 120s;
        # The API's answers depend on the session: never cached by a proxy.
        include /etc/nginx/snippets/skinwise-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Same as /api/ above, rate limited (the limit_req_zone lines at the top of this file).
    location = /api/routine/check {
        limit_req zone=skinwise_check burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/routine/check;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/skinwise-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /api/inci/analyze {
        limit_req zone=skinwise_analyze burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/inci/analyze;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/skinwise-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # The single page: always revalidated, so a new build shows up at once.
    location / {
        include /etc/nginx/snippets/skinwise-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
