[[post]]
author = 1
title = "Ba tuần dùng serum niacinamide buổi sáng"
rating = 4
skin_type = "oily"
disclosure = "none"
products = ["the-ordinary-niacinamide-10-zinc-1"]
body = """Mình da dầu, hay bóng ở vùng chữ T từ khoảng 2 giờ chiều.

Mình dùng serum này buổi sáng, sau toner và trước kem chống nắng, khoảng 3 giọt cho cả mặt. Kết cấu hơi sệt, lúc đầu thoa nhiều quá thì bị vón khi tán kem chống nắng lên trên, giảm lượng thì hết.

Cảm nhận riêng của mình: sau ba tuần mặt đỡ bóng hơn vào buổi chiều, nhưng chưa rõ là nhờ serum hay nhờ trời đã mát hơn. Sẽ dùng tiếp thêm một tháng rồi viết lại."""
likes = [2, 3, 5]
comments = [
  [3, "Mình cũng bị vón khi dùng chung với kem chống nắng, giảm lượng là ổn thật."],
  [5, "Cảm ơn bạn đã ghi rõ thứ tự các bước."],
]

