# Tên thông dụng (tiếng Việt, tiếng Anh thường ngày) -> tên trong danh sách EU (data/eu_glossary.txt).
# Dùng khi bảng thành phần không ghi tên INCI, ví dụ "Rau má", "Vitamin E", "Purified Water".
#
# name: cách người ta hay viết (không phân biệt hoa thường, có dấu hay không).
# lang: "vi" | "en".
# inci: tên EU mà tên thông dụng có thể chỉ; tên đầu tiên được dùng để nhận diện (hoạt chất, chức năng),
#       các tên sau chỉ để hiển thị "có thể là". Mọi tên phải có trong eu_glossary.txt (có test kiểm tra).
# note: chỗ mơ hồ cần lưu ý.
# sources: bằng chứng trên nhãn, [{ url, quote }]: trang chính hãng in tên này cạnh tên INCI (hoặc nêu nó là thành
#   phần chính trong khi bảng INCI cùng trang chỉ có đúng một chất khớp), quote là nguyên văn trên trang.
#   Bắt buộc với mục thêm từ 26/10; kiểm tra: uv run python -m scripts.verify_quotes
#
# Khi tra, các tiền tố "chiết xuất", "tinh chất", "dịch chiết" được bỏ qua: "Chiết xuất rau má" = "Rau má".
# Không cần thêm "Axit/Acid + tên": code tự thử dạng "tên + acid" ("Acid salicylic" = Salicylic Acid).
# Không thêm tên đã có trong eu_glossary.txt: tên EU luôn được tra trước nên mục đó không bao giờ được dùng.
#
# CẢNH BÁO: tên trỏ tới hoạt chất trong ingredients.toml (vd. "Vitamin A" -> Retinol) làm thay đổi kết quả
# kiểm tra routine, nên phải được duyệt như từ điển hoạt chất.
# Claude soạn (24/10) từ tên khoa học của từng loài; sửa 25/10 theo một lượt rà độc lập.
# Người duyệt: Vân Anh, 25/10. Mục thêm sau ngày này cần được duyệt lại.

# --- Tên trỏ tới hoạt chất (ảnh hưởng cảnh báo) ---

