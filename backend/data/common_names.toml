# Tên thông dụng (tiếng Việt, tiếng Anh thường ngày) -> tên trong danh sách EU (data/eu_glossary.txt).
# Dùng khi bảng thành phần không ghi tên INCI, ví dụ "Rau má", "Axit Salicylic", "Purified Water".
#
# name: cách người ta hay viết (không phân biệt hoa thường, có dấu hay không).
# lang: "vi" | "en".
# inci: tên EU mà tên thông dụng có thể chỉ; tên đầu tiên được dùng để nhận diện (hoạt chất, chức năng),
#       các tên sau chỉ để hiển thị "có thể là". Mọi tên phải có trong eu_glossary.txt (có test kiểm tra).
# note: chỗ mơ hồ cần lưu ý.
#
# Khi tra, các tiền tố "chiết xuất", "tinh chất", "dịch chiết" được bỏ qua: "Chiết xuất rau má" = "Rau má".
#
# CẢNH BÁO: tên trỏ tới hoạt chất trong ingredients.toml (vd. "axit salicylic" -> Salicylic Acid) làm
# thay đổi kết quả kiểm tra routine, nên phải được duyệt như từ điển hoạt chất.
# BẢN NHÁP do Claude soạn (24/10) từ tên khoa học của từng loài; chưa có người duyệt.

