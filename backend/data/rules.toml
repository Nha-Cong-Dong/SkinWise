# Lưu ý khi dùng (kind = "usage", một nhóm hoạt chất, không cần cặp sản phẩm). Soạn 26/10; người duyệt (Vân Anh)
# bật cả bốn ngày 26/10, kể cả BHA ở mức info (thông tin hai chiều, không phải cảnh báo).
# Nguồn và đoạn trích do Claude tìm, đã kiểm tra nguyên văn trên trang; người duyệt vẫn phải tự đọc nguồn.
# Lời giải thích là bản nháp do Claude soạn; 26/10 đã đối chiếu lại từng ý với ngữ cảnh trên trang nguồn và sửa
