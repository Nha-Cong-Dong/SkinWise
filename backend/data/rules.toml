# Luật cảnh báo. Engine chỉ dùng luật có published = true.
#
# NGUYÊN TẮC: không có nguồn thì không có cảnh báo.
# - Mỗi luật cần ít nhất một nguồn (sources = [{ url = "...", quote = "..." }]) với quote là đoạn trích NGUYÊN VĂN trên trang url.
#   Kiểm tra: uv run python -m scripts.verify_quotes
# - Chỉ đặt published = true sau khi một người đã đọc nguồn; khi đó điền reviewed_by và reviewed_at.
#   Seed từ chối luật published thiếu nguồn hoặc thiếu người duyệt.
# - Luật do AI soạn để published = false cho đến khi được duyệt.
#
# key: khoá ổn định của luật (không đổi sau khi đã seed).
# kind: conflict (hai nhóm khác nhau) | duplicate (cùng một nhóm ở nhiều sản phẩm) | myth (kết hợp hay bị
#       đồn là xấu nhưng thực ra ổn) | usage (lưu ý khi dùng một nhóm, vd. nhạy nắng; không cần cặp sản phẩm)
#       | profile (chưa dùng trong MVP).
# severity: avoid | caution | info | safe.
# scope: same_step | same_session (cùng buổi sáng/tối) | same_day; luật usage dùng routine (cả routine).
# evidence_level: high | moderate | low | expert_opinion.
# group_a, group_b: mã trong functional_groups.toml; duplicate và usage chỉ dùng group_a.
# INCI không có nồng độ, nên lời giải thích dùng "có thể".
#
# Mỗi nguồn khai báo một lần ở [[source]] (khoá là url), luật tham chiếu bằng url.

# ======================================================================================
# Ứng viên — chưa bật. Nguồn do Claude tìm, quote đã kiểm tra nguyên văn trên trang;
# người duyệt vẫn phải tự đọc nguồn. Lời giải thích là bản nháp do Claude soạn.
# ======================================================================================

# Nguồn: AAD — exfoliating while using retinoid/retinol products may worsen dry skin; FDA labels for
#   adapalene and tretinoin (Retin-A Micro) — caution with salicylic acid, avoid AHA/glycolic products,
#   concomitant salicylic-acid acne products may increase irritation.
# Đã sửa explanation_vi: bỏ "PHA" (không nguồn nào nhắc PHA) và thay lời khuyên "dùng xen kẽ" (không có
#   trong nguồn) bằng lời khuyên trong nhãn thuốc: tạm ngưng sản phẩm acid nếu da kích ứng.
# Lưu ý người duyệt: nguồn nói về "dùng đồng thời / trong thời gian dùng", không riêng "cùng buổi";
#   nhãn thuốc chỉ áp dụng cho retinoid kê đơn (adapalene, tretinoin), không trực tiếp cho retinol mỹ phẩm.
#   Nhãn adapalene nói AHA "should be avoided" (mạnh hơn caution) — giữ caution vì không biết nồng độ.
[[rule]]
key = "retinoid-exfoliant-acid-same-session"
kind = "conflict"
severity = "caution"
scope = "same_session"
evidence_level = "expert_opinion"
group_a = "RETINOID"
group_b = "EXFOLIANT_ACID"
title_vi = "Retinoid và acid tẩy tế bào chết trong cùng một buổi"
explanation_vi = "Dùng retinoid cùng với sản phẩm chứa AHA/BHA (ví dụ glycolic acid, salicylic acid) có thể làm da khô và dễ kích ứng hơn. Nếu da bị kích ứng, có thể cân nhắc tạm ngưng sản phẩm chứa acid."
published = true
reviewed_by = "Vân Anh"
reviewed_at = 2026-10-22
sources = [
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/routine/safely-exfoliate-at-home", quote = "such as prescription retinoid creams or products containing retinol or benzoyl peroxide" },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/routine/safely-exfoliate-at-home", quote = "Exfoliating while using these products may worsen dry skin or even cause acne breakouts." },
  { url = "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=276f7cce-5f54-40f8-8321-9192d0e52a73", quote = "Particular caution should be exercised in using preparations containing sulfur, resorcinol, or salicylic acid in combination with adapalene cream." },
  { url = "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=276f7cce-5f54-40f8-8321-9192d0e52a73", quote = "Moisturizers may be used if necessary, however, products containing alpha hydroxy or glycolic acids should be avoided." },
  { url = "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=08ab7e0c-1437-455f-815c-98904d96a289", quote = "Advise patients that concomitant use of topical over the counter (OTC) acne products containing benzoyl peroxide, sulfur, resorcinol, or salicylic acid with RETIN-A MICRO may increase the risk for local skin irritation including dryness, erythema, and peeling." },
]

# Nguồn: Int J Womens Dermatol review + CMAJ review (PMC) — benzoyl peroxide oxidizes/inactivates
#   tretinoin, apply at different times (BP morning, tretinoin night); FDA label Retin-A Micro —
#   concomitant BPO acne products may increase irritation.
# Đã sửa explanation_vi: nêu rõ tretinoin (nguồn chỉ nói tretinoin) và thêm rằng adapalene, tazarotene,
#   tretinoin dạng micronized không có hạn chế này (theo PMC5986265).
# Lưu ý người duyệt: nhóm RETINOID còn gồm retinol/retinal mỹ phẩm — nguồn không nói gì về chúng.
#   Phần "bất hoạt" chỉ đúng với tretinoin dạng thông thường; với retinoid khác chỉ còn phần kích ứng.
[[rule]]
key = "retinoid-benzoyl-peroxide-same-session"
kind = "conflict"
severity = "caution"
scope = "same_session"
evidence_level = "expert_opinion"
group_a = "RETINOID"
group_b = "BENZOYL_PEROXIDE"
title_vi = "Retinoid và benzoyl peroxide trong cùng một buổi"
explanation_vi = "Benzoyl peroxide có thể oxy hoá và làm giảm tác dụng của tretinoin (dạng thông thường) khi bôi cùng lúc; adapalene, tazarotene và tretinoin dạng micronized không có hạn chế này. Dùng chung cũng có thể làm da khô, kích ứng hơn. Có thể cân nhắc dùng ở hai buổi khác nhau (ví dụ benzoyl peroxide buổi sáng, tretinoin buổi tối)."
published = true
reviewed_by = "Vân Anh"
reviewed_at = 2026-10-22
sources = [
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC5986265/", quote = "Coadministration of BP with tretinoin also leads to oxidation and inactivation of tretinoin; therefore, these agents should be applied at different times (i.e., BP in the morning, tretinoin at night)." },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC5986265/", quote = "The micronized tretinoin formation as well as adapalene and tazarotene do not have similar restrictions." },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC3080563/", quote = "Benzoyl peroxide may oxidize a retinoid such as tretinoin if it is applied simultaneously." },
  { url = "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=08ab7e0c-1437-455f-815c-98904d96a289", quote = "Advise patients that concomitant use of topical over the counter (OTC) acne products containing benzoyl peroxide, sulfur, resorcinol, or salicylic acid with RETIN-A MICRO may increase the risk for local skin irritation including dryness, erythema, and peeling." },
]

# Nguồn: AAD — over-exfoliating can lead to red, irritated skin; more aggressive exfoliation should be done less often.
# Lưu ý người duyệt: nguồn GIÁN TIẾP — AAD nói về tẩy tế bào chết quá mức nói chung, không nói cụ thể về
#   việc chồng nhiều sản phẩm acid trong một buổi. Chưa tìm được nguồn chấp nhận được nói trực tiếp điều đó.
# Đã sửa explanation_vi: thêm hậu quả "đỏ và kích ứng" theo đúng câu của AAD.
[[rule]]
key = "exfoliant-acid-duplicate-same-session"
kind = "duplicate"
severity = "caution"
scope = "same_session"
evidence_level = "low"  # nguồn gián tiếp (người duyệt hạ mức, 22/10)
group_a = "EXFOLIANT_ACID"
title_vi = "Nhiều sản phẩm chứa acid tẩy tế bào chết trong cùng một buổi"
explanation_vi = "Nhiều sản phẩm cùng chứa AHA/BHA/PHA trong một buổi có thể khiến da bị tẩy quá mức, dẫn đến đỏ và kích ứng."
published = true
reviewed_by = "Vân Anh"
reviewed_at = 2026-10-22
sources = [
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/routine/safely-exfoliate-at-home", quote = "Generally, the more aggressive the exfoliation, the less often it needs to be done. Be careful not to over-exfoliate, as this could lead to skin that is red and irritated." },
]

# Nguồn: FDA label Retin-A Micro — using too much tretinoin or too often gives no faster/better results and may cause redness, peeling.
# Lưu ý người duyệt: nguồn GIÁN TIẾP — nhãn nói về dùng quá nhiều MỘT sản phẩm tretinoin, không nói về
#   chồng nhiều sản phẩm retinoid. Chưa tìm được nguồn chấp nhận được nói trực tiếp điều đó.
[[rule]]
key = "retinoid-duplicate-same-session"
kind = "duplicate"
severity = "caution"
scope = "same_session"
evidence_level = "low"  # nguồn gián tiếp (người duyệt hạ mức, 22/10)
group_a = "RETINOID"
title_vi = "Nhiều sản phẩm chứa retinoid trong cùng một buổi"
explanation_vi = "Dùng nhiều sản phẩm chứa retinoid trong một buổi có thể làm tăng nguy cơ kích ứng mà không chắc tăng hiệu quả."
published = true
reviewed_by = "Vân Anh"
reviewed_at = 2026-10-22
sources = [
  { url = "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=08ab7e0c-1437-455f-815c-98904d96a289", quote = "Using too much RETIN-A MICRO or using it too often will not give you faster or better results, and you may get skin redness, peeling, or discomfort." },
]

# Nguồn: Antioxidants 2021 review (Boo, PMC8389214) — clinical studies of combination products list
#   ascorbic acid / ascorbyl glucoside alongside nicotinamide; a gel with 2% ascorbyl glucoside + 3.5%
#   nicotinamide (with ultrasound) reduced hyperpigmentation; but most such studies compare against vehicle,
#   so individual contributions cannot be separated (no synergy shown).
#   Antioxidants 2022 review (PMC8773188) — niacinamide accelerates UV photo-degradation of ascorbic acid.
#   ACS Omega 2024 (PMC11223235) — ascorbic acid in water degrades more quickly in the presence of nicotinamide.
# Lưu ý người duyệt: bằng chứng LẪN LỘN và GIÁN TIẾP. Không tìm được nguồn chấp nhận được nào nói thẳng
#   "dùng chung được" hay bác bỏ chuyện tạo nicotinic acid/đỏ mặt; bài báo gốc thập niên 1960 không tìm
#   thấy bản đọc được (bài 1944 trên ebm-journal.org chỉ có PDF). PubMed đang chặn tải tự động nên không
#   dùng được trang tóm tắt (vd. Ahmad 2018, J Photochem Photobiol B, PMID 29660587 — nguồn gốc của ý
#   "tăng phân huỷ dưới UV"). Hai nguồn "ngược chiều" là thí nghiệm trong dung dịch nước/UV, không phải
#   trên da hay sản phẩm thành phẩm. Không có nguồn nào cho thấy hai chất "bổ trợ nhau".
#   Đã đổi severity safe -> info, evidence_level moderate -> low. Bảng 3 của PMC8389214 không báo tác dụng phụ.
[[rule]]
key = "vitamin-c-niacinamide-myth"
kind = "myth"
severity = "info"
scope = "same_session"
evidence_level = "low"
group_a = "VITAMIN_C"
group_b = "NIACINAMIDE"
title_vi = "Vitamin C và niacinamide: chưa có bằng chứng cần tách riêng, nhưng cũng chưa chắc bổ trợ nhau"
explanation_vi = "Lời đồn cho rằng vitamin C và niacinamide không được dùng chung. Một bài tổng quan khoa học (2021) liệt kê các nghiên cứu lâm sàng dùng sản phẩm chứa cả hai, ví dụ gel có 2% ascorbyl glucoside (một dạng vitamin C) và 3,5% niacinamide giúp giảm tăng sắc tố; tuy vậy các nghiên cứu này không tách được tác dụng của từng chất, nên chưa chứng minh được hai chất bổ trợ nhau. Ngược lại, thí nghiệm trong dung dịch nước cho thấy niacinamide có thể làm vitamin C (ascorbic acid) phân huỷ nhanh hơn, nhất là dưới tia UV; chưa rõ điều này ảnh hưởng thế nào đến sản phẩm bôi trên da. Bằng chứng hiện có còn ít và chưa thống nhất."
published = true
reviewed_by = "Vân Anh"
reviewed_at = 2026-10-22
sources = [
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC8389214/", quote = "The composite formulations additionally contain various active ingredients such as arbutin, kojic acid, ascorbic acid, ascorbyl glucoside, tranexamic acid" },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC8389214/", quote = "Significantly superior results were observed when the composite formulation (A gel containing 2% ascorbyl glucoside, and 3.5% nicotinamide) was applied with ultrasonic treatment, compared to either conventional application only or ultrasonic treatment only" },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC8389214/", quote = "In several other clinical studies, the combined formulation was compared with the vehicle formulation; thus, it is difficult to distinguish the contribution of individual components." },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC8773188/", quote = "Niacinamide, as a component of vitamin B-complex with vitamin C, acts as a photo-degradation accelerator to reduce the stability of ascorbic acid under UV-irradiation" },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11223235/", quote = "Moreover, the instability of ASC when dissolved in water poses a major problem in its quantification" },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC11223235/", quote = "especially because it degrades more quickly in the presence of NIC" },
]

# ======================================================================================
# Ứng viên mới (25/10). Nguồn do Claude tìm, lời giải thích là bản nháp do Claude soạn.
# Người duyệt (Vân Anh, 25/10) bật 2 luật benzoyl peroxide và thẻ myth retinoid + niacinamide.
# ======================================================================================

# Nguồn: nhãn thuốc OTC (FDA) của CeraVe Acne Foaming Cleanser (benzoyl peroxide) và Clinique Acne Solutions
#   Clinical Advanced Clearing Gel (salicylic acid): cả hai đều ghi "skin irritation and dryness is more likely to
#   occur if you use another topical acne medication at the same time". Câu này là câu cảnh báo bắt buộc của
#   chuyên khảo thuốc trị mụn không kê đơn của FDA, nên có trên nhãn của các sản phẩm cùng loại.
# Lưu ý người duyệt:
#   - Nguồn nói "cùng lúc" (at the same time), không riêng "cùng buổi" — giống luật retinoid + acid.
#   - Cảnh báo áp dụng cho THUỐC trị mụn (benzoyl peroxide, salicylic acid ở nồng độ thuốc). Nhóm BHA của SkinWise còn
#     gồm betaine salicylate, capryloyl salicylic acid (không phải thuốc trị mụn theo FDA) và salicylic acid lượng nhỏ
#     làm chất bảo quản -> có thể báo thừa; lời giải thích đã dùng "có thể".
#   - CeraVe Acne Foaming Cleanser là sữa rửa mặt (rửa trôi) nhưng nhãn vẫn có cảnh báo này.
[[rule]]
key = "benzoyl-peroxide-bha-same-session"
kind = "conflict"
severity = "caution"
scope = "same_session"
evidence_level = "expert_opinion"
group_a = "BENZOYL_PEROXIDE"
group_b = "BHA"
title_vi = "Benzoyl peroxide và salicylic acid (BHA) trong cùng một buổi"
explanation_vi = "Benzoyl peroxide và salicylic acid đều là hoạt chất trị mụn. Nhãn thuốc của cả hai loại (theo quy định của FDA Mỹ) ghi rằng dùng cùng lúc với một sản phẩm trị mụn bôi khác có thể làm da khô và kích ứng hơn. Nếu da bị kích ứng, nhãn khuyên chỉ dùng một sản phẩm trị mụn mỗi lần."
published = true
reviewed_by = "Vân Anh"
reviewed_at = 2026-10-25
sources = [
  { url = "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=d9c11b75-14ee-46e3-9b1d-c349a102e2fd", quote = "skin irritation and dryness is more likely to occur if you use another topical acne medication at the same time. If irritation occurs, only use one topical acne medication at a time" },
  { url = "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=2f743f0d-06ca-873c-e063-6394a90a5697", quote = "skin irritation and dryness is more likely to occur if you use another topical acne medication at the same time. If irritation occurs, only use one topical acne medication at a time" },
]

# Nguồn: nhãn thuốc OTC của CeraVe Acne Foaming Cleanser (benzoyl peroxide), như luật trên.
# Hỗ trợ TRỰC TIẾP: hai sản phẩm benzoyl peroxide là hai "topical acne medication" dùng cùng lúc.
# Lưu ý người duyệt: nguồn nói "cùng lúc", không riêng "cùng buổi".
[[rule]]
key = "benzoyl-peroxide-duplicate-same-session"
kind = "duplicate"
severity = "caution"
scope = "same_session"
evidence_level = "expert_opinion"
group_a = "BENZOYL_PEROXIDE"
title_vi = "Nhiều sản phẩm chứa benzoyl peroxide trong cùng một buổi"
explanation_vi = "Dùng hai sản phẩm chứa benzoyl peroxide trong cùng một buổi có thể làm da khô và kích ứng hơn. Nhãn thuốc benzoyl peroxide (theo quy định của FDA Mỹ) khuyên: nếu da bị kích ứng, chỉ dùng một sản phẩm trị mụn mỗi lần."
published = true
reviewed_by = "Vân Anh"
reviewed_at = 2026-10-25
sources = [
  { url = "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=d9c11b75-14ee-46e3-9b1d-c349a102e2fd", quote = "skin irritation and dryness is more likely to occur if you use another topical acne medication at the same time. If irritation occurs, only use one topical acne medication at a time" },
]

# Nguồn: Fu et al., Br J Dermatol 2010 (PMC2841824) — thử nghiệm ngẫu nhiên 196 phụ nữ: bộ sản phẩm có niacinamide
#   và retinyl propionate (cả hai nằm chung trong một sản phẩm trị nếp nhăn) dung nạp tốt hơn tretinoin 0,02% theo mọi
#   tiêu chí trong 8 tuần. Clin Cosmet Investig Dermatol 2023 (PMC9928536) — 38 phụ nữ dùng tretinoin: sản phẩm có
#   niacinamide giảm kích ứng do retinoid. Antioxidants 2021 (PMC8389214) — khó tách đóng góp riêng của niacinamide.
# Lưu ý người duyệt: bằng chứng GIÁN TIẾP — sản phẩm trong cả hai nghiên cứu chứa nhiều thành phần khác (peptide,
#   chất chống oxy hoá, hyaluronic acid...), nên không chứng minh riêng niacinamide. Kiểm tra mục tài trợ / xung đột
#   lợi ích trong hai bài (sản phẩm của nhà sản xuất). Không tìm thấy nguồn nào nói dùng chung gây hại.
#   Đề xuất severity = info, evidence_level = low, như thẻ vitamin C + niacinamide.
[[rule]]
key = "retinoid-niacinamide-myth"
kind = "myth"
severity = "info"
scope = "same_session"
evidence_level = "low"
group_a = "RETINOID"
group_b = "NIACINAMIDE"
title_vi = "Retinoid và niacinamide: đã được dùng chung trong nghiên cứu, chưa thấy lý do phải tách riêng"
explanation_vi = "Lời đồn cho rằng không nên dùng retinoid cùng niacinamide. Một thử nghiệm ngẫu nhiên trên 196 phụ nữ dùng bộ sản phẩm chứa niacinamide và retinyl propionate (một dạng retinoid) thấy bộ sản phẩm này được dung nạp tốt hơn tretinoin theo mọi tiêu chí đo trong 8 tuần; người bị kích ứng thường chỉ ở mức nhẹ. Một nghiên cứu khác trên 38 phụ nữ dùng tretinoin cho thấy sản phẩm có niacinamide dùng kèm giúp giảm kích ứng do retinoid. Tuy vậy, sản phẩm trong cả hai nghiên cứu đều chứa nhiều thành phần khác, nên chưa tách được tác dụng riêng của niacinamide. SkinWise chưa tìm thấy nguồn nào cho thấy dùng chung gây hại."
published = true
reviewed_by = "Vân Anh"
