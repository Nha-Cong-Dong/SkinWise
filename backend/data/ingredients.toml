# Từ điển hoạt chất (chỉ các chất liên quan tới nhóm hoạt chất; thành phần khác để "không nhận ra").
# inci: tên INCI chuẩn (đối chiếu EU CosIng). synonyms: cách viết khác hay gặp trên nhãn.
# groups: mã trong functional_groups.toml; để trống = có trong từ điển nhưng KHÔNG tính là hoạt chất.
# note: chỗ dễ nhầm hoặc giới hạn — người duyệt đọc kỹ các mục có note.
# TRẠNG THÁI: Claude soạn; người duyệt: Vân Anh, 25/10. Mục thêm hoặc sửa sau ngày này cần được duyệt lại.
# Không dùng từ đồng nghĩa trùng tên INCI của chất khác (vd. "BHA" là butylated hydroxyanisole) — có test.

# --- AHA ---
[[ingredient]]
inci = "Glycolic Acid"
groups = ["AHA", "EXFOLIANT_ACID"]

[[ingredient]]
inci = "Lactic Acid"
groups = ["AHA", "EXFOLIANT_ACID"]
note = "Cũng hay dùng với lượng nhỏ để chỉnh pH; INCI không có nồng độ nên vẫn tính là AHA, cảnh báo dùng 'có thể'."

[[ingredient]]
inci = "Mandelic Acid"
groups = ["AHA", "EXFOLIANT_ACID"]

[[ingredient]]
inci = "Malic Acid"
groups = ["AHA", "EXFOLIANT_ACID"]
note = "Thường có lượng nhỏ, có thể chỉ để chỉnh pH. Vẫn tính là AHA (người duyệt 24/10): bỏ sót cảnh báo nguy hiểm hơn báo thừa, cảnh báo đã dùng 'có thể'."

[[ingredient]]
inci = "Tartaric Acid"
groups = ["AHA", "EXFOLIANT_ACID"]
note = "Thường có lượng nhỏ, có thể chỉ để chỉnh pH. Vẫn tính là AHA (người duyệt 24/10): bỏ sót cảnh báo nguy hiểm hơn báo thừa, cảnh báo đã dùng 'có thể'."

[[ingredient]]
inci = "Citric Acid"
groups = []
note = "Thường là chất chỉnh pH; cố ý KHÔNG tính là AHA tẩy tế bào chết."

# --- BHA ---
[[ingredient]]
inci = "Salicylic Acid"
synonyms = ["Beta Hydroxy Acid"]
note = "Không dùng \"BHA\" làm từ đồng nghĩa: trên nhãn, BHA là tên INCI của butylated hydroxyanisole (chất chống oxy hoá; người duyệt bỏ 25/10)."
groups = ["BHA", "EXFOLIANT_ACID"]

[[ingredient]]
inci = "Capryloyl Salicylic Acid"
synonyms = ["LHA"]
groups = ["BHA", "EXFOLIANT_ACID"]
note = "Dẫn xuất của salicylic acid (LHA)."

[[ingredient]]
inci = "Betaine Salicylate"
groups = ["BHA", "EXFOLIANT_ACID"]
note = "Dẫn xuất của salicylic acid, thường được coi là nhẹ hơn."

