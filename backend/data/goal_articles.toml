# Lưu ý người duyệt (s1p1):
#   - Trang AAD 'How to fade dark spots in darker skin tones' viết cho người da trung bình đến sẫm màu; danh sách 'Dark spots and patches often appear when' đứng ngay sau câu 'Many everyday things can trigger extra melanin in people who have darker skin tones.' Bài nêu nguồn là AAD nhưng ở s1p2 có nói rõ trang này viết cho da sẫm màu.
#   - Câu trích AAD là danh sách gạch đầu dòng trên trang, sau khi tải về thành các câu nối nhau.
#   - Bài PMC9165630 (Drugs in Context 2022, Đại học Toronto) là bài tổng quan tường thuật tập trung vào da sẫm màu (skin of colour).
#   - Tôi tự kiểm lại câu trích. PMC: câu 'This response can be triggered...' đứng ngay sau 'PIH occurs due to cutaneous inflammation leading to the overproduction of melanin...', nên câu này nói đúng về thâm sau viêm. AAD: danh sách đứng sau câu 'Many everyday things can trigger extra melanin in people who have darker skin tones.' Đoạn s1p1 chưa nói danh sách này viết cho người da sẫm màu. Người duyệt có thể thêm 'ở người da sẫm màu' vào cuối câu AAD. Không bắt buộc, vì s1p2 đã nêu phạm vi này.
[[article.section.paragraph]]
text_vi = "Thâm sau viêm là một dạng tăng sắc tố thường gặp: theo một bài tổng quan trên PMC (tác giả ở Canada), da sẫm lại sau khi bị tổn thương hoặc viêm, ví dụ do mụn. AAD (Mỹ) kể những lúc đốm thâm hay xuất hiện: khi nốt mụn hoặc mảng vảy nến lành, khi vết thương lành, khi dùng một số thuốc, khi sản phẩm chăm sóc da hoặc tóc gây kích ứng, và khi nội tiết thay đổi như lúc mang thai."
sources = [
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC9165630/", quote = "Post-inflammatory hyperpigmentation (PIH) is another common hyperpigmentation disorder that occurs due to hypermelanosis after trauma or inflammation of the skin." },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC9165630/", quote = "This response can be triggered by both endogenous and exogenous factors such as acne or trauma to the skin." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/routine/fade-dark-spots", quote = "Dark spots and patches often appear when: A pimple or patch of psoriasis clears. A wound caused by an insect bite, cut, burn, or other injury heals. You take (or apply) certain medications. A skin or hair care product irritates your skin. Hormonal changes occur, such as during pregnancy." },
]

# Lưu ý người duyệt (s1p2):
