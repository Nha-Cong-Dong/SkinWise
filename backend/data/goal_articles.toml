#   - Trang AAD còn nói retinol và glycolic acid có thể kích ứng, nhất là da nhạy cảm, và điều này 'bình thường và tạm thời'. Bài không đưa câu này vào để tránh người đọc bỏ qua phản ứng thật; người duyệt cân nhắc.
#   - Đã kiểm 3 đoạn trích: OK. Giữa câu 'go ahead and use the product' và câu 'If you develop a skin reaction' trên trang còn có câu 'some ingredients, such as retinol and glycolic acid, can irritate your skin, particularly if your skin is sensitive. This is normal and temporary.' Bài bỏ câu này. Bỏ như vậy là thận trọng và không làm bài nói quá nguồn.
