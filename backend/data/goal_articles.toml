# Lưu ý người duyệt (s4p1):
#   - Bài không gọi salicylic acid là BHA vì trang AAD không dùng chữ BHA (giống bài mẫu 'acne').
#   - Trên trang, mục này có tiêu đề 'Treat acne' và nói thêm nhiều người bị mụn cần nhiều hơn salicylic acid (trang viết nhầm 'salicylic acne'); ý gặp bác sĩ ở s6p1. Phản biện gợi ý có thể thêm một câu ngay đây; chưa thêm vì đoạn không bị yêu cầu sửa.
#   - 3 đoạn trích OK. Câu đứng ngay sau trên trang, trong mục 'Treat acne', là: "Many people who have acne need more than salicylic acne [sic] to control their acne." Đoạn không nói quá nguồn, và ý gặp bác sĩ đã có ở s6p1. Người duyệt có thể cân nhắc thêm một câu ở đây để người đọc không nghĩ salicylic acid là đủ cho mọi trường hợp mụn.
[[article.section.paragraph]]
text_vi = "Theo AAD, mụn làm bít lỗ chân lông nên lỗ chân lông lộ rõ hơn, và sữa rửa mặt có salicylic acid có thể giúp; nghiên cứu cho thấy salicylic acid có thể làm thông lỗ chân lông. Một số loại đủ dịu để dùng hằng ngày. Nếu bị khô hoặc kích ứng, AAD gợi ý dùng xen kẽ: buổi sáng dùng sữa rửa mặt dịu không gây bít tắc, buổi tối dùng loại có salicylic acid."
sources = [
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/face/treat-large-pores", quote = "Acne clogs your pores, which can make your pores more noticeable. Using a cleanser with salicylic acid may help. Studies show salicylic acid can unclog pores." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/face/treat-large-pores", quote = "Some cleansers containing salicylic acid are gentle enough to use every day." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/face/treat-large-pores", quote = "If the salicylic acid dries or irritates your skin, try alternating cleansers. Use a mild, non-comedogenic cleanser when you wake up and the salicylic acid cleanser before bed." },
]

# Lưu ý người duyệt (s4p2):
#   - R2: sửa theo phản biện, 'bớt to' thành 'bớt lộ rõ' cho khớp nguồn ('pores can look larger... may help') và khớp s1p4.
#   - Nguồn chỉ nói retinol và retinyl palmitate trong mỹ phẩm, không nói retinoid kê đơn.
#   - 3 đoạn trích OK. Nguồn viết 'You can prevent this', bài viết 'có thể hạn chế', tức là nói nhẹ hơn nguồn, chấp nhận được. Đoạn chỉ nói về retinol / retinyl palmitate trong mỹ phẩm, không nói về retinoid kê đơn.
[[article.section.paragraph]]
text_vi = "Với da dầu, mụn nhẹ hoặc da kém săn chắc, AAD cho biết sản phẩm có retinol hoặc retinyl palmitate có thể giúp lỗ chân lông bớt lộ rõ. Nên bôi trước khi đi ngủ. Một số người bị kích ứng; có thể hạn chế bằng cách rửa mặt rồi đợi 30 phút mới bôi. Người đang mang thai hoặc cho con bú không nên dùng sản phẩm có retinol hoặc retinyl palmitate."
