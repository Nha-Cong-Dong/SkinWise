  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/routine/fade-dark-spots", quote = "If you unknowingly apply it to your skin for a long time, the steroids can cause your skin to become thin and fragile or permanently discolored." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/routine/fade-dark-spots", quote = "Liquid bleach is a harmful treatment for removing dark spots and patches. You should never apply it to your skin." },
]

[[article.section]]
heading_vi = "Nám là trường hợp riêng"

# Lưu ý người duyệt (s5p1):
#   - 'đốm li ti' = 'freckle-like spots' (đốm giống tàn nhang).
#   - Sửa theo phản biện: 'thường khởi phát ở độ tuổi 20–40' nay dựa vào câu DermNet ('onset typically between the ages of 20 and 40 years'). Câu AAD (trang causes, một mục dưới 'You have a greater risk if you:') giữ lại làm căn cứ cho 'nhiều hơn hẳn' ('much more common').
#   - Cần biết sắc thái này. AAD viết nám hay gặp nhất ở phụ nữ da trung bình đến sẫm màu. DermNet lại viết nám hay gặp nhất ở loại da Fitzpatrick III–IV và ít gặp hơn ở da đen (V–VI). Hai nguồn không mâu thuẫn trực tiếp, và bài ghi rõ ý này là của AAD.
[[article.section.paragraph]]
text_vi = "Nám gặp ở phụ nữ nhiều hơn hẳn nam giới, thường khởi phát ở độ tuổi 20–40, và hay gặp nhất ở phụ nữ da trung bình đến sẫm màu. Nám tạo các mảng và đốm li ti màu nâu nhạt, nâu, nâu xám hoặc xám xanh, thường ở má, trán, cằm và cả phía trên môi trên. Nám không phải ung thư và cũng không phải dấu hiệu ung thư da."
sources = [
  { url = "https://www.aad.org/public/diseases/a-z/melasma-causes", quote = "Are a woman between the ages of 20 and 40: Melasma is much more common in women than men." },
