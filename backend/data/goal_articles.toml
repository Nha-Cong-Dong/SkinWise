text_vi = "Một số đồ trang điểm và nhiều sản phẩm chăm sóc da, tóc chứa dầu hoặc thành phần có thể gây mụn. AAD khuyên chọn sản phẩm ghi “non-comedogenic” (không gây bít tắc lỗ chân lông) và tẩy trang trước khi ngủ, vì để lớp trang điểm qua đêm vẫn có thể gây mụn. Nếu mụn chỉ mọc ở trán và thái dương, dầu dưỡng tóc có thể là nguyên nhân."
