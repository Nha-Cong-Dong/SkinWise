#   - Chữ 'Vì vậy' là cầu nối của người soạn; phản biện xác nhận ngữ cảnh trang AAD overview đỡ (tiêu đề 'People mistake rosacea for acne, sunburn, or a skin reaction' ngay trước câu khuyên gặp bác sĩ da liễu).
#   - Câu AAD khuyên gặp bác sĩ da liễu đứng ngay sau tiêu đề 'People mistake rosacea for acne, sunburn, or a skin reaction' (overview, dòng 639), nên chữ 'Vì vậy' có ngữ cảnh đỡ.
[[article.section.paragraph]]
text_vi = "Da đỏ không phải lúc nào cũng là rosacea. NHS nêu rosacea có thể trông giống nhiều bệnh khác như mụn trứng cá, viêm da tiếp xúc, viêm da dầu, lupus hay dày sừng nang lông. AAD cho biết một thành phần trong sản phẩm chăm sóc da, ví dụ một chất bảo quản, có thể gây viêm da tiếp xúc dị ứng, làm da đỏ, ngứa và sưng. Vì vậy AAD khuyên gặp bác sĩ da liễu để biết da đang bị gì: bác sĩ khám da và mắt, đôi khi cần xét nghiệm để loại trừ bệnh khác như lupus."
