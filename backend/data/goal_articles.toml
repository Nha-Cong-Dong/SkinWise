#   - Đoạn này gộp lời khuyên chống nắng của trang đốm tuổi và trang nám. Ý 'mỗi ngày, kể cả ngày nhiều mây' chỉ có nguồn từ trang nám (AAD self-care). Tôi chấp nhận vì cả hai trang đưa cùng một lời khuyên.
[[article.section.paragraph]]
text_vi = "AAD khuyên tìm bóng râm và mặc đồ chống nắng: áo dài tay mỏng nhẹ, quần dài, mũ rộng vành, kính có chống tia UV. Thoa kem chống nắng lên mọi vùng da không được quần áo che, trước khi ra ngoài. Kem cần chống nắng phổ rộng, SPF 30 trở lên và chịu nước. Bảo vệ da mỗi ngày, kể cả ngày nhiều mây."
sources = [
  { url = "https://www.aad.org/public/cosmetic/age-spots-marks/get-rid-spots", quote = "To get the protection you need, dermatologists recommend that you seek shade and cover your skin with sun-protective clothing." },
  { url = "https://www.aad.org/public/cosmetic/age-spots-marks/get-rid-spots", quote = "Examples of sun-protective clothing and accessories, include a light-weight and long-sleeve shirt, pants, a wide-brimmed hat, and sunglasses with UV protection." },
  { url = "https://www.aad.org/public/cosmetic/age-spots-marks/get-rid-spots", quote = "To protect your skin from the sun, you also need to apply sunscreen to all skin not covered by clothing. Apply sunscreen before you go outside." },
  { url = "https://www.aad.org/public/cosmetic/age-spots-marks/get-rid-spots", quote = "You need a sunscreen that offers: Broad-spectrum protection SPF 30 or higher Water resistance" },
  { url = "https://www.aad.org/public/diseases/a-z/melasma-self-care", quote = "Since sunlight triggers melasma, it is important to protect your skin every day, even on cloudy days and after swimming or sweating." },
]

# Lưu ý người duyệt (s3p3):
#   - 'When used this way' trên trang = thoa trước khi ra ngoài lên mọi vùng da không được che ('You want to apply it before going outside to all skin that clothing won’t cover.'). Trang viết cho da sẫm màu.
#   - Trên trang, 'When used this way' chỉ câu ngay trước: 'You want to apply it before going outside to all skin that clothing won't cover.' Bài viết 'dùng đúng cách' là chấp nhận được. Nếu muốn sát nguồn hơn, có thể viết 'thoa trước khi ra ngoài lên mọi vùng da không được che'. 'Kem chống nắng có màu chứa iron oxide' là một loại thành phần, không nêu tên sản phẩm nên không tính là gợi ý mua.
[[article.section.paragraph]]
text_vi = "Theo AAD, kem chống nắng dùng đúng cách có thể ngăn đốm thâm mới và giúp làm mờ đốm cũ. Với người da sẫm màu, AAD gợi ý kem chống nắng có màu chứa iron oxide, vì iron oxide giúp chắn ánh sáng nhìn thấy, một nguyên nhân gây thâm."
sources = [
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/routine/fade-dark-spots", quote = "When used this way, sunscreen can prevent new dark spots and patches. It can also help to clear existing ones." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/routine/fade-dark-spots", quote = "To get the protection you need to prevent (and help clear) dark spots, use tinted sunscreen with iron oxide. Iron oxide helps to protect your skin from the sun's visible light (a cause of dark spots)." },
]

[[article.section]]
heading_vi = "Các nhóm hoạt chất thường được nhắc tới"

# Lưu ý người duyệt (s4p1):
#   - 'this option' trên trang = 'a product that you can buy without a prescription' (ở Mỹ). Nhưng danh sách retinoid của AAD có cả tretinoin và tazarotene, vốn là thuốc kê đơn; bài KHÔNG chép phần trong ngoặc của retinoid để khỏi viết thuốc kê đơn như hàng tự mua (xem s4p2). Ở trang nám, AAD lại xếp azelaic acid, kojic acid, vitamin C vào thuốc bác sĩ có thể kê. Không nguồn nào nói nồng độ trong mỹ phẩm.
#   - Glycolic acid là AHA; nguồn không dùng chữ AHA ở đây nên bài không thêm. Dàn ý có niacinamide: AAD không liệt kê niacinamide ở danh sách này (xem s4p3).
#   - Kojic acid có trong danh sách của AAD nên được giữ; người duyệt kiểm xem kojic acid có nhóm trong functional_groups.toml không (bài chỉ hiển thị, không gắn nhóm).
#   - Trên trang, 'this option' là 'a product that you can buy without a prescription' (ở Mỹ). Bài không nói danh sách này là hàng mua không cần đơn, và đã bỏ phần trong ngoặc (tretinoin, tazarotene). Như vậy là đúng. Nhưng chữ 'retinoid' chung chung vẫn bao gồm cả thuốc kê đơn, và chỉ s4p2 làm rõ điểm này. Người duyệt nên đọc s4p1 và s4p2 liền nhau. Ở trang nám, AAD xếp azelaic acid, kojic acid và vitamin C vào nhóm thuốc bác sĩ có thể kê. Không nguồn nào nói về quy định ở Việt Nam.
[[article.section.paragraph]]
text_vi = "Theo AAD, khi đã loại bỏ nguyên nhân và bảo vệ da khỏi nắng, sản phẩm làm mờ thâm thường hiệu quả hơn. Trong bài cho người da sẫm màu, AAD khuyên chọn sản phẩm chứa một trong các hoạt chất: azelaic acid, glycolic acid, kojic acid, retinoid hoặc vitamin C. Các chất này có thể làm mờ đốm thâm sẵn có, và trong một số trường hợp còn làm chậm quá trình tạo melanin."
sources = [
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/routine/fade-dark-spots", quote = "Once you eliminate what’s causing the dark spots and protect your skin from sunlight, a product that can fade dark spots (or even out your skin tone) tends to be more effective." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/routine/fade-dark-spots", quote = "If you choose this option, use a product that contains one of the following ingredients: Azelaic acid Glycolic acid Kojic acid Retinoid (retinol, tretinoin, adapalene gel, or tazarotene) Vitamin C" },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/routine/fade-dark-spots", quote = "These ingredients can fade existing dark spots. In some cases, the ingredient can also slow down production of melanin, which is what causes the dark spots and patches." },
]

# Lưu ý người duyệt (s4p2):
#   - Câu retinol nằm trong trang AAD về mụn ở da sẫm màu (mẹo chọn sản phẩm cho mụn), không phải trang về thâm.
#   - Câu trích tretinoin ở trang nám AAD nói về TỔ HỢP tretinoin + corticosteroid nhẹ do bác sĩ kê cho nám; bài chỉ dùng nó để đỡ ý 'tretinoin là thuốc bác sĩ kê', không nói tretinoin một mình làm mờ thâm. Không nguồn nào trong bài nói thẳng 'tretinoin chỉ có theo đơn'.
#   - Hai câu PMC đứng ngay sau nghiên cứu tretinoin 0,1% trên 28 phụ nữ da đen bị nám (67% bị retinoid dermatitis). Nguồn không nói về retinol mỹ phẩm. 'được cho là' giữ mức 'It has been suggested'.
#   - 'viêm da kích ứng' là cách dịch 'retinoid dermatitis' của người soạn.
#   - Câu về retinol lấy từ trang AAD về mụn ở da sẫm màu. Ngữ cảnh: 'You'll find benzoyl peroxide, salicylic acid, or retinol in acne products that you can buy without a prescription.' Retinol là hàng mua không cần đơn ở Mỹ, nên bài viết không sai.
#   - Ý 'tretinoin là thuốc do bác sĩ da liễu kê' hiện chỉ dựa vào câu về tổ hợp tretinoin + corticosteroid ở trang nám (nằm dưới 'Your dermatologist may prescribe one or more of the following:'). Căn cứ này đủ nhưng gián tiếp. Trang PMC có câu trực tiếp hơn: 'The most commonly prescribed retinoids are tretinoin, tazarotene and adapalene.' Câu này có trên file pmc9165630.txt, đứng ngay trước đoạn nói về retinoid dermatitis. Người duyệt có thể thêm nó làm nguồn.
#   - Hai câu PMC về retinoid dermatitis đứng sau các nghiên cứu dùng tretinoin 0,1% (50% và 67% người bệnh bị retinoid dermatitis). Chữ 'retinoid' là chữ của chính nguồn. Nhưng vì câu này đứng ngay sau câu về retinol, người đọc có thể hiểu là retinol mỹ phẩm cũng như vậy, trong khi nguồn chỉ có dữ liệu về tretinoin kê đơn. Người duyệt có thể thêm 'trong các nghiên cứu với tretinoin' nếu muốn chặt hơn.
[[article.section.paragraph]]
text_vi = "Theo AAD, retinol có thể làm thông lỗ chân lông và làm mờ đốm thâm. Một số retinoid khác như tretinoin là thuốc do bác sĩ da liễu kê. Bài tổng quan trên PMC lưu ý retinoid có thể gây viêm da kích ứng, có thể gây ra hoặc làm nặng thêm thâm sau viêm ở người da sẫm màu; bắt đầu từ nồng độ thấp rồi tăng dần được cho là có thể giúp giảm tác dụng phụ này."
sources = [
  { url = "https://www.aad.org/public/diseases/acne/diy/skin-color", quote = "Retinol: This can unclog pores and fade dark spots." },
  { url = "https://www.aad.org/public/diseases/a-z/melasma-treatment", quote = "Your dermatologist may prescribe a medication that can decrease the excess pigment in your skin." },
  { url = "https://www.aad.org/public/diseases/a-z/melasma-treatment", quote = "Tretinoin and a mild corticosteroid: This combination contains a retinoid and an anti-inflammatory, which can even out skin tone." },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC9165630/", quote = "This side effect of retinoid dermatitis is concerning because this condition might cause or exacerbate PIH in patients with darker skin." },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC9165630/", quote = "It has been suggested that starting at lower dosages and slowly increasing the concentration of the retinoid might help mitigate these side effects." },
]

# Lưu ý người duyệt (s4p3):
#   - Câu DermNet 'It is reported to improve complexion...' nằm trong danh sách dưới tiêu đề 'Nicotinamide used as medicine may benefit the skin in several different ways.' DermNet cập nhật 2018. 'reported to' giữ thành 'được ghi nhận'. Khoảng trắng trước dấu phẩy ('pigmentation ,', 'dermatology ,') có sẵn trên trang.
#   - Câu PMC còn nêu arbutin, liquiritin; bài bỏ để gọn. Bài viết 'có lợi' cho 'shown therapeutic benefits' (tránh chữ 'điều trị').
#   - Vitamin C ở đây là ascorbic acid; nguồn không nói về dẫn xuất vitamin C.
#   - Câu PMC nằm dưới tiêu đề mục 'Cosmeceuticals', nên chữ 'hoạt chất mỹ phẩm' có căn cứ. Câu DermNet nằm dưới 'Nicotinamide used as medicine may benefit the skin...', trong đó có ghi 'it is used in some cosmeceutical products'. Đoạn dài 86 chữ, vẫn trong giới hạn 40–120.
[[article.section.paragraph]]
text_vi = "Niacinamide (một dạng vitamin B3) được DermNet ghi nhận giúp cải thiện sắc da, gồm sắc tố không đều, mảng loang và đỏ ở da lão hoá; DermNet cũng nói cần thêm nghiên cứu để làm rõ chất này có ích tới đâu. Bài tổng quan trên PMC xếp niacinamide và vitamin C (ascorbic acid) vào nhóm hoạt chất mỹ phẩm có lợi cho rối loạn sắc tố ở da sẫm màu; các chất này thường dung nạp tốt nhưng còn thiếu nghiên cứu dài hạn."
sources = [
  { url = "https://dermnetnz.org/topics/nicotinamide", quote = "Nicotinamide, also known as niacinamide or nicotinic acid amide, is the water-soluble, active form of vitamin B3." },
  { url = "https://dermnetnz.org/topics/nicotinamide", quote = "It is reported to improve complexion, by improving the pigmentation , blotchiness and redness of ageing skin; it is used in some cosmeceutical products." },
  { url = "https://dermnetnz.org/topics/nicotinamide", quote = "It has been increasingly studied for many different indications in the field of dermatology , but more research is needed to clarify its value." },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC9165630/", quote = "Agents such as arbutin, ascorbic acid, liquiritin and niacinamide have all shown therapeutic benefits in treating pigmentary disorders in richly pigmented skin." },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC9165630/", quote = "These agents are generally well tolerated; however, more robust long-term studies are lacking." },
]

# Lưu ý người duyệt (s4p4):
#   - Câu AAD về hydroquinone không ghi 'ở Mỹ'; bài ghi '(Mỹ)' vì AAD là tổ chức Mỹ và quy định mua bán là của Mỹ. Quy định ở Việt Nam không có trong nguồn.
#   - Câu hydroquinone nằm dưới 'Your dermatologist may prescribe one or more of the following:' trên trang AAD (căn cứ cho 'bác sĩ da liễu có thể kê').
#   - Câu PMC là phần tóm tắt (abstract), nói về nám và thâm sau viêm ở da sẫm màu.
#   - Bỏ câu AAD (trang nám) 'Your dermatologist may prescribe a medication that’s gentler on your skin like azelaic acid, kojic acid, or vitamin C.' để gọn và tránh trông như mâu thuẫn với s4p1; người duyệt nên biết: ở trang nám, AAD xếp ba chất này vào thuốc bác sĩ có thể kê.
#   - Câu PMC 'gold standard' nằm trong phần tóm tắt nói chung về thâm sau viêm và nám. Chữ 'mua không cần đơn' là để mô tả quy định của Mỹ, không phải gợi ý mua.
[[article.section.paragraph]]
text_vi = "Hydroquinone là thuốc thường dùng cho nám. Theo AAD (Mỹ), hydroquinone không còn có trong sản phẩm mua không cần đơn; bác sĩ da liễu có thể kê thuốc này. Bài tổng quan trên PMC coi hydroquinone là chuẩn vàng trong nhóm thuốc bôi, dùng một mình hoặc phối hợp với thuốc khác."
sources = [
  { url = "https://www.aad.org/public/diseases/a-z/melasma-treatment", quote = "Hydroquinone: This is a common treatment for melasma. It is applied to the skin and works to even out the skin tone. Hydroquinone is no longer available in products that you can buy without a prescription." },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC9165630/", quote = "Topical therapy is the recommended first-line treatment, with the gold standard being hydroquinone, which can be used alone or in combination with other agents." },
]

# Lưu ý người duyệt (s4p5):
#   - 'This may darken dark spots' trên trang không có dấu chấm (cuối một mục danh sách của trang nám, ngay sau là tiêu đề 'Cover up with makeup'). Ngay trước đó là 'Choose gentle, fragrance-free skin care products.'
#   - Trên nhãn tiếng Anh là 'for sensitive skin' / 'fragrance-free'; bài dịch sang tiếng Việt.
#   - Câu 'This may darken dark spots' ở trang nám (self-care), đứng ngay sau 'Choose gentle, fragrance-free skin care products.' Câu 'stop using it' ở trang da sẫm màu. Gộp hai trang như vậy không làm đổi nghĩa.
[[article.section.paragraph]]
text_vi = "Sản phẩm gây kích ứng có thể làm thâm thêm. AAD viết: nếu một sản phẩm làm da rát hoặc châm chích khi bôi thì sản phẩm đó đang kích ứng da, và điều này có thể làm đốm thâm đậm hơn; khi đó nên ngừng dùng. Sản phẩm dịu nhẹ ít gây kích ứng hơn; trên nhãn thường ghi \"cho da nhạy cảm\" hoặc \"không hương liệu\"."
sources = [
  { url = "https://www.aad.org/public/diseases/a-z/melasma-self-care", quote = "If a skin care product burns or stings when you use it, the product is irritating your skin." },
  { url = "https://www.aad.org/public/diseases/a-z/melasma-self-care", quote = "This may darken dark spots" },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/routine/fade-dark-spots", quote = "If a product burns or stings when you apply it, stop using it." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/routine/fade-dark-spots", quote = "If you're seeing dark spots, try using gentler products. They're less likely to irritate your skin." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/routine/fade-dark-spots", quote = "Products that are gentle on the skin are often labeled \"for sensitive skin.\" You may also see \"fragrance-free\" on the label." },
]

# Lưu ý người duyệt (s4p6):
#   - Sửa theo phản biện: 'nhập khẩu' đổi thành 'nhập vào Mỹ từ nước khác' để giữ góc nhìn của nguồn ('imported from other countries', trang của tổ chức Mỹ). AAD khuyên mua hàng sản xuất tại Mỹ hoặc do bác sĩ gợi ý; bài BỎ lời khuyên đó vì không áp dụng cho người dùng Việt Nam và vì quy tắc không gợi ý mua gì.
#   - 'steroids' dịch là 'corticoid' theo ngữ cảnh; người duyệt có thể giữ 'steroid'.
#   - Đúng như ghi chú của người soạn: trang AAD khuyên mua hàng sản xuất ở Mỹ hoặc do bác sĩ gợi ý, và bài đã bỏ lời khuyên này.
[[article.section.paragraph]]
text_vi = "AAD cảnh báo một số sản phẩm làm mờ thâm chứa chất rất có hại: các nhà nghiên cứu đã tìm thấy corticoid hoặc thuỷ ngân không ghi trên nhãn trong một số sản phẩm chăm sóc da nhập vào Mỹ từ nước khác. Bôi corticoid lâu ngày mà không biết có thể làm da mỏng, dễ tổn thương hoặc đổi màu vĩnh viễn. Không bao giờ bôi thuốc tẩy dạng lỏng (bleach) lên da."
sources = [
