text_vi = "Da dầu vẫn cần dưỡng ẩm. AAD khuyên thoa kem dưỡng ẩm sau khi rửa mặt để giữ nước cho da; để tiết kiệm thời gian và chống tia UV, có thể chọn kem dưỡng có kèm chống nắng phổ rộng SPF 30 trở lên."
