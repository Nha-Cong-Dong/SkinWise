heading_vi = "Những thói quen có thể làm mụn nặng hơn"

[[article.section.paragraph]]
text_vi = "Nặn hay bóp mụn dễ đẩy mủ, tế bào chết hoặc vi khuẩn vào sâu hơn trong da và làm tăng viêm; mụn có thể rõ hơn, gây đau và đôi khi để lại sẹo. NHS cũng khuyên không nặn mụn. AAD khuyên dùng sản phẩm cho mụn thay vì nặn; mụn sâu hoặc đau thì cần gặp bác sĩ da liễu."
sources = [
