# Lưu ý người duyệt (s3p1):
#   - Trang AAD 'habits-stop' nói các sản phẩm này 'don't cause breakouts in most people', tức không bảo đảm cho mọi người; bài theo câu của trang oily-skin nhưng không lặp lời hứa 'won't clog your pores or cause acne'. Đoạn trích thứ hai là danh sách gạch đầu dòng nối liền sau khi tải.
#   - 2 đoạn trích OK. Bài không lặp lời hứa 'won't clog your pores or cause acne' của AAD. Đoạn chỉ nói về nhãn ghi trên sản phẩm, không nêu sản phẩm hay thương hiệu nào.
[[article.section.paragraph]]
text_vi = "AAD khuyên chọn sản phẩm ghi \"oil free\" (không dầu) và \"non-comedogenic\" (không gây bít tắc lỗ chân lông), kể cả sữa rửa mặt, kem dưỡng và đồ trang điểm. Với lỗ chân lông to, AAD khuyên tìm một trong các cụm \"non-comedogenic\", \"oil free\", \"won't clog pores\" trên mọi thứ bôi lên mặt; không thấy thì đừng dùng."
sources = [
  { url = "https://www.aad.org/public/everyday-care/skin-care-basics/dry/oily-skin", quote = "DO choose skin care products that are labeled “oil free” and “noncomedogenic.” This means that products that have these labels — including cleansers, moisturizers, and makeup — won’t clog your pores or cause acne." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/face/treat-large-pores", quote = "To avoid clogged pores, look for one of the following terms on everything you apply to your face: Non-comedogenic Oil free Won’t clog pores If you don’t see one of these terms, don’t use the product." },
]

