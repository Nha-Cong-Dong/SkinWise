# Lưu ý người duyệt (s2p3):
#   - R2: sửa theo phản biện, 'đừng chà mạnh' thành 'đừng chà xát da' cho đúng nguồn ('resist the temptation to scrub your skin'; 'Never scrub, rub...').
#   - Dàn ý có 'rửa quá nhiều làm da tiết dầu hơn': nguồn chỉ nói sữa rửa mặt QUÁ MẠNH làm tăng tiết dầu (s2p2), không nói rửa nhiều lần.
#   - 5 đoạn trích OK. Câu về cách rửa bằng đầu ngón tay lấy từ trang viết cho da bị mụn, và bài đã ghi rõ 'Với da hay nổi mụn'.
#   - Người điều phối sửa theo đúng đề xuất 'fix' của người phản biện vòng 2 (đoạn còn needs_revision): 'chà xát gây kích ứng và viêm' → 'chà xát có thể gây kích ứng và viêm'.
[[article.section.paragraph]]
text_vi = "Khi rửa, đừng chà xát da, kể cả lúc tẩy trang. Theo AAD, chà xát có thể gây kích ứng và viêm, và khi da bị viêm thì lỗ chân lông thường lộ rõ hơn; chà mặt cũng không làm mặt sạch hơn. Nên dùng nước ấm vì nước nóng có thể kích ứng da. Với da hay nổi mụn, AAD gợi ý thoa sữa rửa mặt nhẹ bằng đầu ngón tay theo vòng tròn, rửa lại bằng nước ấm rồi thấm khô bằng khăn sạch."
sources = [
  { url = "https://www.aad.org/public/everyday-care/skin-care-basics/dry/oily-skin", quote = "While washing, resist the temptation to scrub your skin, even to remove makeup." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/face/treat-large-pores", quote = "Scrubbing can irritate your skin, causing inflammation. When skin is inflamed, pores tend to be more noticeable." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/face/treat-large-pores", quote = "Scrubbing your face won’t make it any cleaner, but scrubbing can irritate your skin, which can make your pores look larger." },
