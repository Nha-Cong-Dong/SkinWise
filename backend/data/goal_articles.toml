  { url = "https://www.aad.org/public/everyday-care/skin-care-basics/dry/dermatologists-tips-relieve-dry-skin", quote = "Dry skin? Stop using skin care products that contain any of the following: Alcohol (except for hand sanitizer) Fragrance, including deodorant soaps Retinoids" },
