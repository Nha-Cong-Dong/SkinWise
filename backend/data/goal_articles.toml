# Lưu ý người duyệt (s6p4):
#   - AAD không nói những sản phẩm không cần đơn NÀO không an toàn khi mang thai, nên bài không nêu tên. DermNet nói về retinoid dạng thuốc, không nói về retinol mỹ phẩm. Câu 'women of childbearing age must use effective contraception…' trên DermNet không đưa vào vì dễ bị hiểu là áp dụng cho mọi sản phẩm có retinoid.
[[article.section.paragraph]]
text_vi = "Nếu đang mang thai hoặc muốn có thai, AAD khuyên hỏi bác sĩ da liễu trước khi tự xử lý mụn, vì một số sản phẩm cho mụn mua không cần đơn không an toàn khi mang thai. DermNet cho biết một số retinoid bôi chống chỉ định khi mang thai, đặc biệt tazarotene khi dùng trên diện rộng."
sources = [
  { url = "https://www.aad.org/public/diseases/acne/diy/adult-acne-treatment", quote = "If you’re pregnant or trying to get pregnant, consult a dermatologist before treating acne on your own." },
  { url = "https://www.aad.org/public/diseases/acne/diy/adult-acne-treatment", quote = "Some acne treatments you can buy without a prescription aren’t safe to use during pregnancy." },
  { url = "https://dermnetnz.org/topics/topical-retinoids", quote = "Some topical retinoids are contraindicated for use in pregnancy" },
  { url = "https://dermnetnz.org/topics/topical-retinoids", quote = "Teratogenic — potential risk in pregnancy particularly with widespread tazarotene use (pregnancy category X in US)" },
]

