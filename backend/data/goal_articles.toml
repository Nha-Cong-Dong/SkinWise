# Lưu ý người duyệt (s2p1):
#   - Câu về giờ rửa (khi thức dậy, trước khi ngủ) lấy từ trang AAD 'habits-stop', vốn viết cho da bị mụn.
#   - 3 đoạn trích OK. Giờ rửa mặt (khi thức dậy, trước khi đi ngủ) lấy từ trang AAD viết cho da bị mụn; bài dùng chữ 'ví dụ' nên chấp nhận được.
#   - Chỗ cần sửa trong dropped_claims: trang habits-stop CÓ nói về số lần rửa: "Washing your face several times a day can further irritate your skin, leading to more breakouts." Câu này nói về kích ứng và nổi mụn, không nói về tăng tiết dầu. Vì vậy câu 'nguồn không nói số lần rửa' trong dropped_claims không đúng. Có thể thêm ý này vào s2p1, ghi rõ là trang viết cho da bị mụn, nếu muốn.
#   - Người điều phối sửa theo đúng đề xuất 'fix' của người phản biện vòng 2 (đoạn còn needs_revision): 'hoặc da nhiều dầu làm lỗ chân lông trông to hơn' → 'hoặc da nhiều dầu có thể làm lỗ chân lông trông to hơn'.
[[article.section.paragraph]]
text_vi = "AAD khuyên rửa mặt tối đa hai lần mỗi ngày và sau khi đổ mồ hôi, ví dụ khi thức dậy và trước khi đi ngủ. Theo AAD, lỗ chân lông bị bít hoặc da nhiều dầu có thể làm lỗ chân lông trông to hơn, và rửa mặt hai lần mỗi ngày có thể làm thông lỗ chân lông, ngăn bít tắc và giảm dầu."
sources = [
  { url = "https://www.aad.org/public/everyday-care/skin-care-basics/dry/oily-skin", quote = "DO cleanse your face up to twice daily and after sweating." },
  { url = "https://www.aad.org/public/diseases/acne/skin-care/habits-stop", quote = "Wash your face twice a day — when you wake up and before you go to bed. You’ll also want to wash your face when you finish an activity that makes you sweat." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/face/treat-large-pores", quote = "Clogged pores or an oily complexion can make pores look larger. Cleansing twice daily can unclog pores, prevent clogged pores, and reduce oiliness." },
]

# Lưu ý người duyệt (s2p2):
#   - 4 đoạn trích OK. 'có thể' trong bài bao cả hai vế 'kích ứng' và 'tiết dầu nhiều hơn', khớp với 'can irritate ... and trigger' của nguồn.
[[article.section.paragraph]]
text_vi = "Nhiều người nghĩ da dầu cần sữa rửa mặt mạnh để làm khô da. AAD cho biết sữa rửa mặt quá mạnh có thể kích ứng da và làm da tiết dầu nhiều hơn; nên chọn loại tạo bọt, dịu nhẹ và không gây bít tắc. AAD cũng khuyên không dùng sữa rửa mặt gốc dầu hoặc gốc cồn vì có thể gây kích ứng."
sources = [
  { url = "https://www.aad.org/public/everyday-care/skin-care-basics/dry/oily-skin", quote = "Many people believe that they need to use a strong face wash for oily skin in order to dry out their skin. However, using a face wash that is too harsh can irritate your skin and trigger increased oil production." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-basics/dry/oily-skin", quote = "DO use a gentle, foaming face wash." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/face/treat-large-pores", quote = "Find a gentle, non-comedogenic cleanser." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-basics/dry/oily-skin", quote = "DON’T use oil-based or alcohol-based cleansers. These can irritate your skin." },
