text_vi = "DermNet khuyên người da nhạy cảm thử sản phẩm mới trên một vùng da nhỏ trước khi bôi cả mặt hay cả người, và mỗi lần chỉ thêm một sản phẩm mới. Theo DermNet, kích ứng da thường là do tiếp xúc dồn lại với nhiều chất kích ứng nhẹ."
