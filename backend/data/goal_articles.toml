  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/prevent-skin-problems/test-skin-care-products", quote = "If you develop a skin reaction, gently wash the product off as soon as possible, and don’t use it again." },
]

# Lưu ý người duyệt (s4p3):
#   - Lượt 2: viết 'sản phẩm chăm da' đúng như nguồn ('skin care products', aad-dry-skin-tips-full.txt dòng 629-631). Nguồn không nói gì về retinoid do bác sĩ kê; bài không thêm câu 'hỏi bác sĩ' vì đoạn trích không đỡ. Người duyệt có thể cân nhắc thêm đoạn trích 'Does anything you apply to your skin (including moisturizer) cause burning, stinging, or irritation? Tell your dermatologist.' (đã dùng ở s6p2) nếu muốn có câu dẫn tới bác sĩ.
#   - Lượt 2: bỏ câu BS Kazin khuyên tránh cồn, AHA, hương liệu (và đoạn trích của nó) vì đã chuyển sang s3p3, tránh trùng ý theo article_issues.
#   - 'Cồn' ở đây theo nguồn là alcohol nói chung; nguồn không phân biệt cồn béo (cetyl, stearyl alcohol) với cồn khô. Bài không phân biệt.
#   - DermNet nêu ví dụ chất bảo quản (formalin, paraben, quaternium-15); bài chỉ viết 'một số chất bảo quản'. Đoạn trích DermNet là mục trong danh sách gạch đầu dòng (dermnet-sensitive-skin.txt dòng 166), không có dấu chấm cuối.
#   - Đã kiểm 2 đoạn trích: OK. Câu DermNet nằm trong danh sách 'Sensitive skin is exacerbated by various triggers' (dòng 161-166), nên viết 'hay gây kích ứng' là đúng.
#   - AAD khuyên người da khô ngừng dùng retinoid. Người đang dùng retinoid do bác sĩ kê có thể hiểu là tự ngừng thuốc. Nguồn không phân biệt hai trường hợp này. Người duyệt cân nhắc có nên thêm câu dẫn tới bác sĩ (dùng đoạn trích 'Tell your dermatologist' như ghi chú đã gợi ý) hay không.
[[article.section.paragraph]]
text_vi = "Theo DermNet, những chất hay gây kích ứng gồm mỹ phẩm, xà phòng và sữa rửa, hương liệu, AHA và một số chất bảo quản. AAD khuyên người da khô ngừng dùng sản phẩm chăm da có cồn (trừ nước rửa tay khô), hương liệu (kể cả xà phòng khử mùi) và retinoid."
sources = [
