  { url = "https://www.aad.org/public/diseases/rosacea/what-is/overview", quote = "When anything irritates the sensitive skin of rosacea, you can experience a flare." },
  { url = "https://www.nhs.uk/conditions/rosacea/", quote = "It's not known what causes rosacea, but some things can make symptoms worse. Common triggers for rosacea include: alcohol spicy foods hot drinks sunlight hot or cold temperatures aerobic exercise, like running being stressed" },
  { url = "https://www.aad.org/public/diseases/rosacea/treatment/redness", quote = "Common triggers include overheating, drinking alcohol, and eating spicy foods." },
  { url = "https://www.aad.org/public/diseases/rosacea/what-is/overview", quote = "The color can become more noticeable when something triggers it, like when you apply certain skin care products to your face or drink red wine." },
]

# Lưu ý người duyệt (s2p2):
#   - Câu AAD có lỗi gõ trên trang ('“trigger,”and' thiếu khoảng trắng); đoạn trích giữ nguyên.
#   - AAD có nhắc bảng kiểm yếu tố khởi phát trong 'Rosacea Diary' của National Rosacea Society; bài không nêu tên tổ chức/tài liệu này.
#   - Lượt 2: 'humid conditions' đổi từ 'nơi ẩm thấp' thành 'không khí ẩm' theo phản biện.
#   - Ba đoạn trích NHS cuối là các mục trong danh sách 'Do' của trang.
[[article.section.paragraph]]
text_vi = "Yếu tố khởi phát mỗi người mỗi khác. AAD gợi ý ghi nhật ký hằng ngày để tìm ra yếu tố của riêng mình rồi tránh chúng. NHS khuyên nếu đã biết một yếu tố như rượu hay đồ cay làm triệu chứng nặng hơn thì cố tránh càng nhiều càng tốt; tránh nóng, nắng và không khí ẩm nếu có thể; che mặt khi trời lạnh; và tìm cách giảm căng thẳng."
sources = [
  { url = "https://www.aad.org/public/diseases/rosacea/what-is/overview", quote = "Anything that causes a flare is called a “trigger,”and triggers can be different for everyone. Keeping a daily journal can help you find your triggers, so you can avoid them." },
  { url = "https://www.nhs.uk/conditions/rosacea/", quote = "If you know a trigger like alcohol or spicy food makes symptoms worse, try to avoid it as much as possible." },
  { url = "https://www.nhs.uk/conditions/rosacea/", quote = "try to avoid heat, sunlight or humid conditions if possible" },
  { url = "https://www.nhs.uk/conditions/rosacea/", quote = "try to cover your face in cold weather" },
  { url = "https://www.nhs.uk/conditions/rosacea/", quote = "take steps to manage stress" },
]

[[article.section]]
heading_vi = "Chăm sóc da nhẹ nhàng"

# Lưu ý người duyệt (s3p1):
#   - Trang AAD này viết cho người có rosacea; bài đặt mọi lời khuyên trong ngữ cảnh rosacea, không mở rộng cho mọi kiểu da đỏ.
#   - Ngay trước các lời khuyên rửa mặt, trang AAD tips (dòng 649) có câu 'Never use an astringent or toner.' Bài không đưa câu này vào. Người duyệt có thể cân nhắc thêm nếu muốn, nhưng không bắt buộc.
[[article.section.paragraph]]
text_vi = "AAD cho biết rosacea thường làm da nhạy cảm, dễ kích ứng, nên chăm sóc da đúng cách đóng vai trò quan trọng. Các bác sĩ da liễu khuyên rửa mặt hai lần mỗi ngày, thật nhẹ: chọn sữa rửa mặt dịu, không dùng xà phòng; thoa bằng đầu ngón tay theo vòng tròn; rửa sạch bằng nước ấm, chỉ dùng đầu ngón tay, vì sữa rửa mặt còn sót lại có thể gây kích ứng; rồi thấm nhẹ bằng khăn bông sạch."
sources = [
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Rosacea often makes skin sensitive and easily irritated, so proper skin care plays a key role in controlling this condition." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Cleanse your face twice a day — very gently." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Choose a mild, rosacea friendly cleanser (not soap)." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Apply the cleanser gently with your fingertips, using a circular motion." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Rinse off the cleanser with warm water, using only your fingertips. You want to be gentle but also thoroughly remove your cleanser. If some of the cleanser stays on your skin, it can cause irritation." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Pat your face gently with a clean, cotton towel." },
]

# Lưu ý người duyệt (s3p2):
#   - 'If you exfoliate your skin, stop.' không phân biệt tẩy da chết cơ học hay hoá học (acid); bài cũng không phân biệt.
#   - Phản biện ghi câu mở đầu trùng ý với s2p1; người duyệt có thể bỏ nếu muốn gọn (lượt này không đổi vì không bị yêu cầu).
#   - Câu mở đầu trùng ý với s2p1 ('bất cứ thứ gì kích ứng...'). Không phải lỗi.
[[article.section.paragraph]]
text_vi = "Theo AAD, bất cứ thứ gì kích ứng da đều có thể làm rosacea bùng phát. Vì vậy nên rửa mặt bằng đầu ngón tay thay vì khăn hay bông mút rửa mặt, và tránh chà xát, kỳ cọ hay mát-xa vùng da bị rosacea. Nếu đang tẩy tế bào chết, AAD khuyên dừng lại."
sources = [
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Be gentle with your skin. Anything that irritates your skin can cause rosacea to flare." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Use your fingertips to gently wash and rinse your face, without using a washcloth or facial sponge." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Avoid rubbing, scrubbing, or massaging skin with rosacea." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "If you exfoliate your skin, stop." },
]

[[article.section.paragraph]]
text_vi = "Dưỡng ẩm cần thiết dù rosacea làm da khô hay dầu. AAD giải thích dưỡng ẩm giúp giữ nước trong da và bù lại lipid cần thiết, nhờ đó da có thể đỡ kích ứng, dễ chịu hơn. Sau khi rửa mặt, chờ da khô rồi mới thoa kem dưỡng: thoa lên da khô ít bị rát hoặc châm chích hơn. Nếu đang dùng thuốc cho rosacea, bôi thuốc trước rồi mới thoa kem dưỡng."
sources = [
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Moisturizer is essential whether rosacea makes your skin dry or oily." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "When you moisturize, you help hydrate your skin by trapping water in your skin. Moisturizing also restores essential lipids to your skin. These changes can help your skin feel less irritated and more comfortable." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "After washing your face, wait for your face to dry. When you apply moisturizer to dry skin, it’s less likely to burn or sting." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "If you’re using medication to treat rosacea, apply your medication first. Then apply a rosacea friendly moisturizer." },
]

# Lưu ý người duyệt (s3p4):
#   - Đoạn trích thứ hai gồm câu dẫn và một danh sách gạch đầu dòng bị nối thành một dòng khi tải trang.
#   - AAD chỉ ghi 'Alcohol', không nói loại cồn nào. Bài viết 'cồn' đúng như trang.
#   - Glycolic acid và lactic acid là AHA; trang AAD nêu đích danh hai chất, không nói về AHA nói chung. Bài giữ đúng hai tên.
#   - Trang AAD về thử sản phẩm nói retinol và glycolic acid có thể gây kích ứng 'bình thường và tạm thời' ở da nhạy cảm; câu đó không viết cho rosacea nên bài không dùng.
[[article.section.paragraph]]
text_vi = "Theo AAD, nhiều sản phẩm chăm sóc da và mỹ phẩm có thể gây kích ứng da bị rosacea. Để giảm khả năng đó, các bác sĩ da liễu khuyên tránh sản phẩm chứa cồn, camphor, hương liệu, glycolic acid, lactic acid, menthol, sodium lauryl sulfate (thường có trong dầu gội và kem đánh răng) hoặc urea. AAD cũng khuyên chọn sản phẩm ghi “không hương liệu” (fragrance-free) chứ không phải “không mùi” (unscented), và sản phẩm ghi là dành cho da nhạy cảm, không gây bít lỗ chân lông."
sources = [
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "When you have rosacea, many skin care products and cosmetics can irritate your skin." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "To reduce the likelihood of using a product that will irritate your skin, dermatologists recommend that you avoid products that contain any of the following ingredients: Alcohol Camphor Fragrance Glycolic acid Lactic acid Menthol Sodium lauryl sulfate (often found in shampoos and toothpaste) Urea" },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "To reduce the likelihood of a product irritating your skin, choose fragrance-free (rather than unscented) products." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Select products that say they are made for sensitive skin and non-comedogenic (won’t clog pores)." },
]

# Lưu ý người duyệt (s3p5):
#   - 'quarter-sized' (cỡ đồng 25 xu Mỹ, khoảng 2,4 cm) dịch là 'cỡ đồng xu'.
#   - Trang thử sản phẩm của AAD viết cho mọi người, không riêng rosacea; trang rosacea tips dẫn link sang trang này.
[[article.section.paragraph]]
text_vi = "Thử trước có thể giúp tìm ra sản phẩm không làm da kích ứng. AAD hướng dẫn bôi sản phẩm lên một vùng nhỏ cỡ đồng xu ở mặt dưới cánh tay hoặc nếp khuỷu tay, nơi không bị cọ hay rửa trôi, ngày hai lần trong 7–10 ngày. Nếu sau đó da không đỏ, ngứa hay sưng thì có thể dùng. Nếu da phản ứng, rửa sạch nhẹ nhàng càng sớm càng tốt và không dùng lại. Khi khó tìm ra chất gây phản ứng, bác sĩ da liễu có thể giúp, có khi bằng xét nghiệm áp da (patch test)."
sources = [
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Testing can help you find products that don’t irritate your skin." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/prevent-skin-problems/test-skin-care-products", quote = "Apply the product to a test spot twice daily for seven to 10 days." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/prevent-skin-problems/test-skin-care-products", quote = "Choose a quarter-sized spot on your skin where the product won’t be rubbed or washed away, such as the underside of your arm or the bend of your elbow." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/prevent-skin-problems/test-skin-care-products", quote = "If after seven to 10 days you don’t have a skin reaction , such as red, itchy, or swollen skin, go ahead and use the product." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/prevent-skin-problems/test-skin-care-products", quote = "If you develop a skin reaction, gently wash the product off as soon as possible, and don’t use it again." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/prevent-skin-problems/test-skin-care-products", quote = "If it is difficult to pinpoint the exact ingredient causing your skin to react, talk to a board-certified dermatologist, who can help. You may need a medical test called patch testing to help find out what is causing your irritation." },
]

[[article.section]]
heading_vi = "Chống nắng mỗi ngày"

[[article.section.paragraph]]
text_vi = "Theo AAD, nắng có thể làm rosacea nặng hơn vào bất cứ thời điểm nào trong năm, và là một trong những nguyên nhân bùng phát thường gặp nhất, ở người thuộc mọi màu da. AAD khuyên dùng kem chống nắng phổ rộng, SPF 30 trở lên, chống nước, thoa lên mọi vùng da không được quần áo che, kể cả ngày nhiều mây; kèm quần áo chống nắng, mũ rộng vành và kính râm chống tia UV. NHS (Anh) cũng khuyên dùng kem chống nắng SPF ít nhất 30 mỗi ngày."
sources = [
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "The sun can worsen rosacea any time of the year. This is so common that it’s one of the most frequent causes of a rosacea flare-up, and it’s a common trigger for people of all skin tones." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Apply sunscreen that offers broad-spectrum protection, SPF 30 or higher, and water resistance. To protect your skin, apply sunscreen to all skin not covered by clothing. Even on cloudy days, it’s essential to use sunscreen." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Wear sun protective clothing , which includes a wide-brim hat, and sunglasses with UV protection." },
  { url = "https://www.nhs.uk/conditions/rosacea/", quote = "wear a high SPF sunscreen of at least SPF 30 every day" },
]

# Lưu ý người duyệt (s4p2):
#   - Hai trang AAD nói hơi khác nhau: trang rosacea tips nói 'zinc oxide, titanium dioxide, or both'; trang chọn kem chống nắng nói 'only zinc oxide and titanium dioxide'. Bài nêu cả hai, ghi rõ trang nào.
#   - Trang rosacea tips còn liệt kê silicone (dimethicone, cyclomethicone) trong danh sách 'tìm loại chứa'; bài bỏ để gọn.
#   - Với 'sensitive skin' nguồn chỉ nói chọn loại ghi 'sensitive skin' và tránh hương liệu, paraben, oxybenzone; bài giữ đúng phân biệt đó với mục 'Rosacea'.
#   - Trên trang AAD choosing-sunscreen, chữ 'only zinc oxide and titanium dioxide' xuất hiện hai lần: một lần ở mục 'Rosacea', một lần ở mục 'Skin stings or burns'. Đoạn trích lấy đúng mục 'Rosacea'.
[[article.section.paragraph]]
text_vi = "Nếu một loại kem chống nắng làm da kích ứng, AAD gợi ý tìm loại chứa zinc oxide, titanium dioxide hoặc cả hai (gọi là kem chống nắng khoáng), và không hương liệu. Trang hướng dẫn chọn kem chống nắng của AAD viết cho người có rosacea: dùng loại chỉ chứa zinc oxide và titanium dioxide; da nhạy cảm thì chọn loại ghi “sensitive skin”, tránh hương liệu, paraben và oxybenzone. Một số kem chống nắng khoáng để lại vệt trắng, nhất là trên da sẫm màu; AAD gợi ý chọn loại khoáng dạng hạt siêu mịn (micronized) hoặc có màu."
sources = [
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "If you find that a sunscreen irritates your skin, look for a sunscreen that contains:" },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Zinc oxide, titanium dioxide, or both (also called a mineral sunscreen)" },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "No fragrance (label may say “fragrance free,” but if it says “unscented” choose another sunscreen)" },
  { url = "https://www.aad.org/public/everyday-care/sun-protection/shade-clothing-sunscreen/choosing-right-sunscreen", quote = "Rosacea: Use a sunscreen that contains only zinc oxide and titanium dioxide." },
  { url = "https://www.aad.org/public/everyday-care/sun-protection/shade-clothing-sunscreen/choosing-right-sunscreen", quote = "Sensitive skin: Use a sunscreen with the words “sensitive skin” on the label. Avoid products with fragrance, parabens, or oxybenzone (benzophenone-2, benzophenone-3, diosybenzone, mexenone, sulisobenzone, or sulisobenzone sodium)." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Some mineral sunscreens leave a white cast, especially on darker skin tones. To avoid this, dermatologists recommend choosing either a micronized mineral sunscreen or tinted mineral sunscreen." },
]

[[article.section]]
heading_vi = "Khi nào nên gặp bác sĩ da liễu"

# Lưu ý người duyệt (s5p1):
#   - NHS nói 'GP' (bác sĩ đa khoa ở Anh), không phải bác sĩ da liễu; bài viết 'bác sĩ' và 'đi khám' cho câu của NHS, dành chữ 'bác sĩ da liễu' cho câu của AAD.
#   - 'cannot be cured' dịch là 'chưa có cách làm khỏi hẳn' để tránh chữ 'chữa'.
#   - NHS: 'See a GP if' là hộp 'Non-urgent advice' (nhs-rosacea.txt, dòng 33). Bài viết 'khuyên đi khám' và không nói gấp, khớp với nguồn.
[[article.section.paragraph]]
text_vi = "NHS (Anh) cho biết hiện chưa có cách làm rosacea khỏi hẳn, nhưng các cách xử lý do bác sĩ đưa ra có thể giúp kiểm soát triệu chứng, và rosacea có thể nặng hơn nếu không được xử lý; NHS khuyên đi khám nếu có triệu chứng rosacea. AAD cũng nói rosacea càng tiến triển thì càng khó xử lý. Bác sĩ da liễu sẽ lập kế hoạch riêng cho từng người, gồm cách tránh yếu tố khởi phát, chăm sóc da nhẹ nhàng và chống nắng."
sources = [
  { url = "https://www.nhs.uk/conditions/rosacea/", quote = "Rosacea cannot be cured, but treatment from a GP can help control the symptoms. It can get worse if it's not treated." },
  { url = "https://www.nhs.uk/conditions/rosacea/", quote = "See a GP if: you have symptoms of rosacea" },
  { url = "https://www.aad.org/public/diseases/rosacea/what-is/overview", quote = "The more rosacea progresses, the more difficult it becomes to treat." },
  { url = "https://www.aad.org/public/diseases/rosacea/treatment/redness", quote = "If you have rosacea, your dermatologist will create a treatment plan tailored to your individual needs." },
  { url = "https://www.aad.org/public/diseases/rosacea/treatment/redness", quote = "Your treatment plan will include tips to help you avoid what triggers your flare-ups, gentle skin care, and sun protection." },
]

# Lưu ý người duyệt (s5p2):
#   - Câu 'The medications work by narrowing…' trên trang AAD nói về brimonidine gel và oxymetazoline cream (thuốc kê đơn được FDA phê duyệt, kèm tên thương hiệu). Bài cố ý không nêu tên hoạt chất hay thương hiệu.
#   - Câu cuối là cầu nối của người soạn, dựa trên việc mọi đoạn trích đều nói 'prescription' / 'prescribe'. Phản biện cho rằng 'quyết định cách dùng' là suy diễn nhẹ; người duyệt có thể rút thành 'Đây là thuốc do bác sĩ kê, không phải sản phẩm tự mua.' (lượt này không đổi vì phản biện không yêu cầu).
#   - Lượt 2: bỏ chữ 'uống' theo phản biện, vì NHS chỉ viết 'taking antibiotics'. Viết 'hoặc cho dùng kháng sinh' thay cho 'hay dùng kháng sinh' (gợi ý của phản biện) để câu không đọc như bác sĩ là người dùng kháng sinh; nghĩa không đổi.
#   - Trang AAD redness có nêu azelaic acid là thuốc được FDA phê duyệt cho rosacea, và câu 'Benzoyl peroxide can irritate sensitive skin, making it an unacceptable treatment for rosacea.' Bài không đưa vào vì dàn ý không có.
#   - Ý 'co mạch máu' ghép hai trang: overview nói chung về 'a few prescription medications', còn trang redness nêu cơ chế của brimonidine/oxymetazoline (dòng 631). Hai trang nói về cùng nhóm thuốc làm mờ màu đỏ kéo dài trong 12 giờ, nên ghép không làm sai nghĩa. Bài không nêu tên thuốc hay tên thương hiệu, và có câu nói rõ đây là thuốc do bác sĩ kê.
#   - Ở câu 'quyết định cách dùng', vẫn có thể rút gọn như ghi chú của người soạn.
[[article.section.paragraph]]
text_vi = "Ngoài chăm sóc da, kế hoạch của bác sĩ có thể có thêm thuốc. Theo NHS, bác sĩ có thể kê kem hoặc gel bôi, hoặc cho dùng kháng sinh trong 6–16 tuần. AAD cho biết có vài thuốc kê đơn làm co mạch máu dưới da nên tạm thời giảm đỏ; bác sĩ da liễu sẽ cho biết thuốc đó có hợp với bạn không. Đây đều là thuốc do bác sĩ kê và quyết định cách dùng, không phải sản phẩm tự mua."
sources = [
  { url = "https://www.nhs.uk/conditions/rosacea/", quote = "A GP may suggest: prescriptions for creams and gels you put on your skin taking antibiotics for 6 to 16 weeks" },
  { url = "https://www.aad.org/public/diseases/rosacea/what-is/overview", quote = "A few prescription medications can fade the persistent color quickly." },
  { url = "https://www.aad.org/public/diseases/rosacea/treatment/redness", quote = "The medications work by narrowing the blood vessels under the skin, which temporarily reduces flushing and long-lasting color changes on the skin." },
  { url = "https://www.aad.org/public/diseases/rosacea/what-is/overview", quote = "Your dermatologist can tell you if this medication is right for you." },
  { url = "https://www.aad.org/public/diseases/rosacea/treatment/redness", quote = "Your dermatologist may prescribe one that can reduce flushing." },
]

# Lưu ý người duyệt (s5p3):
#   - Câu về nguy hiểm khi người thiếu kinh nghiệm làm nằm trong mục 'Visible blood vessels' (mạch máu lộ rõ) trên trang AAD redness, nói về laser, ánh sáng và đốt điện cho mục đó.
#   - 'board-certified' là chứng nhận chuyên khoa ở Mỹ; bài dịch là 'được chứng nhận chuyên môn'.
#   - Lượt 2: thêm 'phù hợp' cho đúng 'The right laser can effectively reduce' theo phản biện.
[[article.section.paragraph]]
text_vi = "AAD cho biết liệu pháp ánh sáng xung cường độ cao (IPL) có thể giảm đỏ bừng, và laser phù hợp có thể giảm màu đỏ, hồng, tím hay nâu do rosacea. Tuy vậy, laser, ánh sáng hay đốt điện do người thiếu kinh nghiệm thực hiện có thể nguy hiểm, gây bỏng, đổi màu da vĩnh viễn hoặc sẹo. AAD khuyên chọn bác sĩ da liễu được chứng nhận chuyên môn để làm các thủ thuật này."
sources = [
  { url = "https://www.aad.org/public/diseases/rosacea/treatment/redness", quote = "A treatment called intense pulsed light therapy can reduce flushing and improve your skin’s texture." },
  { url = "https://www.aad.org/public/diseases/rosacea/treatment/redness", quote = "Laser therapy: The right laser can effectively reduce the red or pink (lighter skin tones) or the violet or brown (darker skin tones) color changes that can occur." },
  { url = "https://www.aad.org/public/diseases/rosacea/treatment/redness", quote = "In inexperienced hands, laser therapy, light treatments, or electrodesiccation can be dangerous. Burns, permanent changes to your skin color, or scars can occur." },
  { url = "https://www.aad.org/public/diseases/rosacea/treatment/redness", quote = "The AAD recommends that you choose a board-certified dermatologist to perform your procedure." },
]

# Lưu ý người duyệt (s5p4):
#   - Lượt 2: thêm đoạn trích 'Be sure to use the antibiotic that your dermatologist prescribes', một tiêu đề ngắn đứng riêng ở dòng 654 của aad-rosacea-redness.txt, trong mục 'Antibiotic eye treatment'. check_text.py báo OK.
#   - Lượt 2: câu nốt chắc / da dày lên giờ ghi rõ 'Với người đã được chẩn đoán rosacea', đúng ngữ cảnh trên trang AAD ('Thickening skin: If you’re diagnosed with rosacea, pay attention to your skin.').
#   - Lượt 2: thêm điều kiện 'nếu không được xử lý gấp' (từ 'which can be serious if not treated urgently'), để đỡ chữ 'hẹn khám gấp'. Đoạn trích NHS nằm dưới hộp 'Urgent advice: Ask for an urgent GP appointment or call 111' (dịch vụ của Anh); bài không nêu số 111.
#   - Lượt 2: bỏ câu mở đầu 'Một số dấu hiệu nên đi khám sớm.' (tiêu đề section đã nói ý này) để đoạn ở mức 116 chữ, dưới trần 120.
#   - Câu 'If you notice firm, round bumps...' đứng ngay sau 'Thickening skin: If you’re diagnosed with rosacea, pay attention to your skin.' (redness, dòng 658), nên ngữ cảnh 'Với người đã được chẩn đoán rosacea' là đúng. Đoạn trích keratitis của NHS nằm dưới hộp 'Urgent advice' (dòng 35–36).
[[article.section.paragraph]]
text_vi = "AAD cho biết rosacea có thể ảnh hưởng tới mắt, làm mắt khô và kích ứng; khi đó cần được xử lý, và chỉ dùng loại kháng sinh bác sĩ da liễu kê, vì kháng sinh dành cho da có thể gây hại cho mắt. Với người đã được chẩn đoán rosacea, nếu thấy nốt chắc, tròn hoặc da dày lên trên mặt (hay gặp nhất ở mũi), nên gặp bác sĩ da liễu. NHS khuyên hẹn khám gấp nếu có rosacea mà mắt đau, nhìn mờ, nhạy cảm với ánh sáng, mắt đỏ hoặc cộm, vì đó có thể là dấu hiệu viêm giác mạc, có thể nghiêm trọng nếu không được xử lý gấp."
sources = [
  { url = "https://www.aad.org/public/diseases/rosacea/what-is/overview", quote = "Rosacea can also affect your eyes causing them to be dry and irritated." },
  { url = "https://www.aad.org/public/diseases/rosacea/treatment/redness", quote = "When rosacea affects your eyes, treatment is essential." },
  { url = "https://www.aad.org/public/diseases/rosacea/treatment/redness", quote = "Not every antibiotic is safe for use on your eyes. Antibiotics made for the skin can be harmful when used to treat the eyes." },
  { url = "https://www.aad.org/public/diseases/rosacea/treatment/redness", quote = "Be sure to use the antibiotic that your dermatologist prescribes" },
  { url = "https://www.aad.org/public/diseases/rosacea/treatment/redness", quote = "If you notice firm, round bumps or thickening of the skin on your face, it’s time to see a dermatologist. These changes are most common on the nose." },
  { url = "https://www.nhs.uk/conditions/rosacea/", quote = "If you have rosacea and: your eye is painful your vision is blurred you're sensitive to light you have a red eye your eye feels gritty These could be signs of keratitis, which can be serious if not treated urgently." },
]

