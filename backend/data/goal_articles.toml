# Lưu ý người duyệt (s3p2):
#   - StatPearls viết cho người hành nghề y (NCBI Bookshelf, cập nhật 12/02/2024). Ở mục khác cùng trang, ceramide còn được xếp vào chất khoá ẩm (nhóm sterol); bài theo câu ở phần tổng quan.
#   - Đã kiểm 4 đoạn trích: OK. Bốn câu nằm liền nhau trong phần tổng quan của StatPearls. Cùng trang có câu 'Some humectants can increase TEWL and exacerbate skin dryness without concomitant use of an occlusive moisturizer'. Bài không đưa câu này vào. Bài không nói chất hút ẩm luôn tốt, nên đây không phải lỗi, nhưng người duyệt có thể cân nhắc thêm nếu còn chỗ.
[[article.section.paragraph]]
text_vi = "StatPearls (tài liệu y khoa của Mỹ) giải thích kem dưỡng ẩm thường phối hợp ba loại chất. Chất hút ẩm như glycerin, hyaluronic acid kéo nước về da. Chất khoá ẩm như petrolatum, dầu khoáng tạo một lớp màng trên da, làm giảm bay hơi nước. Chất làm mềm như bơ shea, ceramide lấp khe giữa các tế bào da, giúp da mịn và mềm."
sources = [
  { url = "https://www.ncbi.nlm.nih.gov/sites/books/NBK545171/", quote = "Moisturizers contain a combination of humectants, occlusive agents, and emollients that work together to improve skin hydration and prevent water loss." },
  { url = "https://www.ncbi.nlm.nih.gov/sites/books/NBK545171/", quote = "Humectants, such as glycerin and hyaluronic acid, attract water to the skin and help to increase its water content." },
  { url = "https://www.ncbi.nlm.nih.gov/sites/books/NBK545171/", quote = "Occlusive agents, such as petrolatum and mineral oil, form a physical barrier over the skin that reduces water evaporation." },
  { url = "https://www.ncbi.nlm.nih.gov/sites/books/NBK545171/", quote = "Emollients, such as shea butter and ceramides, help to smooth and soften the skin by filling in gaps between skin cells." },
]

# Lưu ý người duyệt (s3p3):
#   - Danh sách AAD là gạch đầu dòng (aad-dry-skin-tips-full.txt dòng 617-627), nối liền khi tải trang.
#   - Lượt 2: câu ceramide và câu tránh cồn/AHA/hương liệu đều là lời BS Kazin trên cùng trang pick-moisturizer (aad-pick-moisturizer-full.txt dòng 600), thuộc mục 'dry-skin do's and don'ts' (vì vậy viết 'khuyên da khô'). Đã thêm đoạn trích tránh AHA vào chính đoạn này và bỏ câu tương ứng ở s4p3 để khỏi lặp.
#   - Hai trang AAD mâu thuẫn nhẹ: trang mẹo da khô gợi ý kem có lactic acid, BS Kazin khuyên tránh AHA. StatPearls xác nhận lactic acid là AHA. Bài nêu cả hai, không chọn bên; câu 'Lưu ý lactic acid là một AHA.' do người soạn thêm, có đoạn trích StatPearls đỡ. Người duyệt cân nhắc.
#   - Không nêu nồng độ lactic acid vì nguồn AAD không nói. StatPearls có câu 'Lactic acid has been used topically at concentrations up to 12%…' nhưng đó là dùng cho ichthyosis, không đưa vào.
#   - Đã kiểm 4 đoạn trích: OK. Câu 'Avoid products with alcohol, AHA, and fragrance' nằm trong mục 'Listen to your skin: ..., says Dr. Kazin. That said, be careful about new products...' (dòng 600). Trang không ghi thẳng câu này là của BS Kazin, chỉ nằm liền sau lời bà, nên viết 'bác sĩ này cũng khuyên' là một suy diễn hợp lý. Nếu muốn chặt hơn, có thể viết 'trang này cũng khuyên'.
#   - Ngữ cảnh StatPearls: AHA được giới thiệu là 'an important group of humectant molecules often used as moisturizing agents'. Như vậy chính StatPearls xem AHA (lactic acid) là chất dưỡng ẩm. Bài nêu cả hai vế, không chọn bên nào, người đọc có thể thấy rối. Người duyệt quyết định có giữ câu 'Lưu ý lactic acid là một AHA.' hay không.
[[article.section.paragraph]]
text_vi = "AAD gợi ý tìm kem hoặc dạng mỡ có một hay nhiều chất sau: dầu jojoba, dimethicone, glycerin, hyaluronic acid, lactic acid, lanolin, dầu khoáng, petrolatum, bơ shea. Trên một trang khác của AAD, một bác sĩ da liễu nhắc thêm ceramide, chất béo dạng sáp giúp da giữ ẩm; bác sĩ này cũng khuyên da khô tránh sản phẩm có cồn, AHA và hương liệu. Lưu ý lactic acid là một AHA."
sources = [
  { url = "https://www.aad.org/public/everyday-care/skin-care-basics/dry/dermatologists-tips-relieve-dry-skin", quote = "Look for a cream or ointment that contains one or more of the following ingredients: Jojoba oil Dimethicone Glycerin Hyaluronic acid Lactic acid Lanolin Mineral oil Petrolatum Shea butter" },
  { url = "https://www.aad.org/public/everyday-care/skin-care-basics/dry/pick-moisturizer", quote = "Dr. Kazin says that if you scan the ingredient list of a moisturizer, look for things such as ceramides, which are waxy lipid molecules that help hydrate skin, and hyaluronic acid, which is also known for its intense moisturizing qualities." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-basics/dry/pick-moisturizer", quote = "Avoid products with alcohol, alpha-hydroxy acid (AHA), and fragrance to help your skin retain its natural oils." },
  { url = "https://www.ncbi.nlm.nih.gov/sites/books/NBK545171/", quote = "AHAs include glycolic and lactic acids." },
]

# Lưu ý người duyệt (s3p4):
