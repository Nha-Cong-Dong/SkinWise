text_vi = "AAD khuyên chọn sản phẩm ghi \"fragrance-free\" (không hương liệu). Sản phẩm ghi \"unscented\" (không mùi) vẫn có thể chứa chất trung hoà hoặc che mùi của thành phần khác, và các chất này có thể kích ứng da khô, nhạy cảm. StatPearls cũng khuyên chọn kem dưỡng không hương liệu, vì kem dưỡng càng nhiều hoá chất thì khả năng dị ứng càng cao."
sources = [
  { url = "https://www.aad.org/public/everyday-care/skin-care-basics/dry/dermatologists-tips-relieve-dry-skin", quote = "Dermatologists recommend using products labeled \"fragrance-free.\"" },
  { url = "https://www.aad.org/public/everyday-care/skin-care-basics/dry/dermatologists-tips-relieve-dry-skin", quote = "If you see the word \"unscented,\" the product can contain chemicals that neutralize or hide the odors of other ingredients. These chemicals can irritate dry, sensitive skin." },
