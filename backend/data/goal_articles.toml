#   - 'Acne is associated with enlarged pores' là vế đầu của câu; phần sau dấu gạch ngang trên trang nói về mụn đầu đen trong lỗ chân lông và mụn viêm làm yếu miệng nang.
#   - Dàn ý có 'di truyền': không nguồn nào trong bài nói thẳng là di truyền. Bài không dùng chữ 'di truyền'.
#   - 4 đoạn trích OK. Câu định nghĩa và danh sách yếu tố khớp với trang DermNet (bài viết năm 2017). Trang có thêm ý 'một số nhóm dân tộc (gốc Phi, gốc Ấn) có thể có lỗ chân lông to hơn'; bài không dùng ý này, chấp nhận được.
#   - Người điều phối sửa theo đúng đề xuất 'fix' của người phản biện vòng 2 (đoạn còn needs_revision): 'lỗ chân lông bị bít sẽ giãn ra nên trông rõ hơn' → 'lỗ chân lông bị bít sẽ giãn ra, nên có thể trông rõ hơn'.
[[article.section.paragraph]]
text_vi = "Theo DermNet, lỗ chân lông to là những chỗ lõm trên bề mặt da mặt, nơi có miệng ống dẫn mồ hôi và dầu. Các yếu tố có thể làm lỗ chân lông to ra gồm: tiết nhiều bã nhờn, kích thước nang lông, dùng sản phẩm gây bít tắc, da mất đàn hồi theo tuổi và tổn thương do nắng. Mụn cũng liên quan tới lỗ chân lông to. AAD giải thích thêm: lỗ chân lông bị bít sẽ giãn ra, nên có thể trông rõ hơn."
sources = [
  { url = "https://dermnetnz.org/topics/enlarged-pores", quote = "Enlarged pores are depressions in the facial skin surface that contain one or more openings to the ducts carrying sweat and oil from their respective eccrine glands and sebaceous glands." },
  { url = "https://dermnetnz.org/topics/enlarged-pores", quote = "Factors that may lead to enlarged pores include: Increased sebum production Hair follicle size Use of comedogenic products Loss of skin elasticity with age Sun damage." },
  { url = "https://dermnetnz.org/topics/enlarged-pores", quote = "Acne is associated with enlarged pores" },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/face/treat-large-pores", quote = "When pores clog, they expand, which can make your pores look more noticeable." },
]

# Lưu ý người duyệt (s1p3):
#   - R2: bỏ vế 'da càng bị nắng làm tổn thương thì càng kém săn chắc' và đoạn trích 'The more sun damaged your skin…' khỏi đoạn này vì lặp với s5p2 (theo article_issues); ý này giờ chỉ còn ở s5p2.
#   - Ý 'nội tiết' trong dàn ý chỉ được đỡ bằng câu về chu kỳ kinh (DermNet). Trang DermNet seborrhoea nói da dầu đôi khi do androgen dư (buồng trứng đa nang) hoặc là dấu hiệu bệnh khác (Parkinson, to đầu chi); bài không đưa vào.
#   - 4 đoạn trích OK, có giữ từ chỉ mức độ ('thường', 'có thể'). Trang DermNet ngay trước câu về chu kỳ kinh ghi 'There are conflicting data on whether men or women are more prone to large pores'; bài không so sánh nam và nữ nên không bị lệch.
[[article.section.paragraph]]
text_vi = "Lỗ chân lông to gặp ở mọi lứa tuổi và mọi nhóm dân tộc, và thường trông to hơn khi lớn tuổi. Ở phụ nữ, kích thước lỗ chân lông có thể thay đổi theo chu kỳ kinh. AAD cho biết theo tuổi da mất độ săn chắc và bắt đầu chảy xệ, khi đó lỗ chân lông trông to hơn."
sources = [
  { url = "https://dermnetnz.org/topics/enlarged-pores", quote = "Enlarged pores can be seen at all ages and in all ethnic groups." },
  { url = "https://dermnetnz.org/topics/enlarged-pores", quote = "Pores often appear larger with age." },
  { url = "https://dermnetnz.org/topics/enlarged-pores", quote = "In women, pore size may fluctuate during the menstrual cycle, with the largest pore size occurring during ovulation." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/face/treat-large-pores", quote = "As we age, our skin loses its firmness and starts to sag. Pores look larger when skin sags." },
]

# Lưu ý người duyệt (s1p4):
#   - Không nguồn nào nói thẳng 'không thể thu nhỏ vĩnh viễn'. Bài chỉ nói những gì hai nguồn nói: DermNet 'not very effective', AAD 'less noticeable'. URL trang AAD có chữ 'treat-large-pores' nhưng nội dung nói 'make pores less noticeable'.
#   - 3 đoạn trích OK. Đoạn này nói đúng mức nguồn: DermNet viết 'not very effective', AAD viết 'less noticeable'. Đoạn không hứa thu nhỏ lỗ chân lông.
[[article.section.paragraph]]
text_vi = "Cần biết trước: theo DermNet, các cách nhằm ngăn hoặc thu nhỏ lỗ chân lông to không hiệu quả lắm. AAD cũng không nói tới thu nhỏ, mà nói rằng chăm da đúng cách có thể làm lỗ chân lông bớt lộ rõ, và phần lớn việc này mỗi người tự làm được."
sources = [
  { url = "https://dermnetnz.org/topics/enlarged-pores", quote = "Treatments that focus on preventing and shrinking large pores are not very effective." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/face/treat-large-pores", quote = "With the right skin care, you can make pores less noticeable." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/face/treat-large-pores", quote = "There’s actually a lot you can do to make pores less noticeable. Much of this, you can do on your own." },
]

