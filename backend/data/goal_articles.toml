#   - Đã đọc aad-fade-dark-spots.txt dòng 602: 'begins with sunscreen' nằm trên trang về da sẫm màu. Bài mở câu bằng 'Với da sẫm màu', nên phạm vi đúng với nguồn.
[[article.section.paragraph]]
text_vi = "Theo AAD, retinoid và azelaic acid có thể giúp làm mờ vết thâm sau mụn. Với da sẫm màu, AAD cho biết việc làm mờ đốm thâm bắt đầu từ kem chống nắng; lột da hoá học, mài da vi điểm hay laser, kể cả loại dùng tại nhà, có thể để lại vết thâm hoặc đốm sáng màu vĩnh viễn, nên AAD khuyên gặp bác sĩ da liễu trước."
