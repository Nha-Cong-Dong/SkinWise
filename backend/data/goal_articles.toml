[[article.section]]
heading_vi = "Vết thâm và sẹo sau mụn"

# Lưu ý người duyệt (s5p1):
#   - Câu 'last much longer than the acne' nằm trên trang AAD cho da màu (skin of color: người gốc Phi, Á, Latinh…). Người dùng Việt Nam thuộc nhóm 'Asian' mà trang này nêu.
[[article.section.paragraph]]
text_vi = "Sau khi mụn lành, da có thể để lại vết thâm, gọi là tăng sắc tố sau viêm. Theo AAD, vết thâm này hay gặp hơn ở người da sẫm màu và có thể kéo dài lâu hơn nhiều so với nốt mụn. AAD nhấn mạnh cần xử lý cả mụn, vì hết mụn thì nguyên nhân gây thâm cũng không còn."
sources = [
  { url = "https://www.aad.org/public/diseases/acne/diy/adult-acne-treatment", quote = "Those dark spots, which more commonly develop in people with darker skin tones, are called post-inflammatory hyperpigmentation (PIH)." },
  { url = "https://www.aad.org/public/diseases/acne/diy/skin-color", quote = "Many people seek a dermatologist's help for the dark spots, which can last much longer than the acne. It's important to treat the acne, too. When you get rid of the acne, you eliminate what's causing the dark spots." },
]

