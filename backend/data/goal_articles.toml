[[article]]
goal = "acne"
title_vi = "Da dễ nổi mụn: những điều nên biết"
published = true
reviewed_by = "Vân Anh"
reviewed_at = 2026-11-07

[[article.section]]
heading_vi = "Mụn hình thành thế nào"

[[article.section.paragraph]]
text_vi = "Theo NHS (Anh), mụn có thể xuất hiện khi nang lông bị bít bởi dầu thừa và tế bào da chết; vi khuẩn có thể phát triển trong nang lông bị bít, gây viêm và mủ. DermNet (New Zealand) lưu ý cơ chế chính xác của mụn chưa được hiểu hết. Mụn thường gặp ở mặt, ngực và lưng."
sources = [
  { url = "https://www.nhs.uk/conditions/acne/", quote = "Acne can happen when hair follicles (where hair grows on the skin) become blocked with excess oil and dead skin cells. Bacteria can grow in blocked hair follicles and cause inflammation and pus." },
  { url = "https://dermnetnz.org/topics/acne", quote = "Acne is due to a combination of factors. The exact mechanisms are not fully understood." },
  { url = "https://www.nhs.uk/conditions/acne/", quote = "It usually affects your face, chest and back." },
]

# Lưu ý người duyệt (s1p2):
#   - Trên trang NHS, các câu này là chú thích của ảnh minh hoạ từng dạng mụn, không phải văn bản liền mạch.
#   - r2: bỏ câu mở đầu 'Một người có thể có nhiều dạng mụn cùng lúc' (và đoạn trích 'There are different types of spots…') để bài không vượt 1500 chữ, theo gợi ý cắt bù của phản biện.
#   - Các câu NHS là chú thích ảnh, không phải văn bản liền mạch (người soạn đã ghi).
[[article.section.paragraph]]
text_vi = "Theo NHS: mụn đầu trắng là nốt nhỏ cùng màu da; mụn đầu đen là chấm đen hoặc nâu, thường phẳng; sẩn là nốt nổi lên trên da; mụn mủ là nốt nổi có chứa mủ; cục và nang là khối lớn hơn nằm dưới da, có thể liền nhau và gây đau."
sources = [
  { url = "https://www.nhs.uk/conditions/acne/", quote = "Whiteheads are small bumps that are the same colour as your skin." },
  { url = "https://www.nhs.uk/conditions/acne/", quote = "Blackheads are black and brown spots that are usually flat but may be raised." },
  { url = "https://www.nhs.uk/conditions/acne/", quote = "Papules are raised bumps." },
  { url = "https://www.nhs.uk/conditions/acne/", quote = "Pustules are raised bumps filled with pus." },
  { url = "https://www.nhs.uk/conditions/acne/", quote = "Nodules and cysts are larger lumps under your skin. They may join together and can be painful." },
]

# Lưu ý người duyệt (s1p3):
#   - Đoạn trích là một danh sách gạch đầu dòng trên trang; sau khi tải về, các mục nối liền nhau không có dấu câu nên câu trích đọc như một câu dài. 'Một số bệnh lý' = NHS nêu PMOS và rosacea. Ý 'ma sát' trong dàn ý được đưa sang s4p5 (khăn, mũ) vì nguồn nói ở đó.
[[article.section.paragraph]]
text_vi = "NHS nêu một số yếu tố có thể gây mụn: thay đổi nội tiết (tuổi dậy thì, kỳ kinh, mãn kinh, mang thai), một số bệnh lý, một số loại thuốc, và sản phẩm bôi lên da hoặc tóc làm da nhờn hơn."
sources = [
  { url = "https://www.nhs.uk/conditions/acne/", quote = "Acne can be caused by: changes in hormone levels, such as during puberty, periods, menopause and pregnancy conditions such as polyendocrine metabolic ovarian syndrome (PMOS) and rosacea taking certain medicines products you use on your skin or hair that can make your skin greasy" },
]

[[article.section]]
heading_vi = "Các nhóm hoạt chất bôi da thường được nhắc tới"

# Lưu ý người duyệt (s2p1):
#   - Trang AAD này nói về mụn ở người lớn (25 tuổi trở lên). Câu trích đầu tiên là lời của BS Ramone F. Williams đặt trong ngoặc kép; đoạn trích bỏ dấu ngoặc và dấu phẩy cuối.
#   - r2: đổi 'Viện Da liễu Hoa Kỳ' thành 'Viện Hàn lâm Da liễu Hoa Kỳ' theo article_issues (khớp rules.toml dòng 429, sát nghĩa 'Academy'). goals.toml vẫn còn hai cách gọi khác (dòng 391, 887, 1110); người điều phối nên thống nhất ở đó.
[[article.section.paragraph]]
text_vi = "Theo các bác sĩ da liễu viết cho AAD (Viện Hàn lâm Da liễu Hoa Kỳ), nhiều người lớn bị mụn nhẹ có thể cải thiện bằng sản phẩm không cần kê đơn, và điều quyết định là hoạt chất trong sản phẩm. NHS (Anh) gợi ý thử sản phẩm bôi có salicylic acid hoặc benzoyl peroxide, có thể hỏi dược sĩ."
sources = [
  { url = "https://www.aad.org/public/diseases/acne/diy/adult-acne-treatment", quote = "Many adults who have mild acne can effectively treat it with over-the-counter (available without a prescription), acne-fighting products available today" },
  { url = "https://www.aad.org/public/diseases/acne/diy/adult-acne-treatment", quote = "It’s all about the active ingredient in the product, according to Julie Harper, MD, FAAD." },
  { url = "https://www.nhs.uk/conditions/acne/", quote = "try acne treatments you put on your skin such as salicylic acid or benzoyl peroxide – you can speak to a pharmacist for advice" },
]

# Lưu ý người duyệt (s2p2):
#   - Câu 'This medication works…' nằm ngay sau tiêu đề 'Retinoid you apply to your skin' trên trang chẩn đoán/điều trị của AAD, nơi liệt kê thuốc bôi bác sĩ dùng (được FDA phê duyệt). Câu này nói về retinoid nói chung, không riêng retinol mỹ phẩm.
#   - Câu về retinol lấy từ trang AAD '10 tips cho mụn ở da màu' (skin of color); trang này không nói nồng độ retinol. Bài không nêu nồng độ adapalene. Trang skin-color có nói adapalene gel 0.1% được FDA cho bán không cần đơn, nhưng câu đó kèm tên thương hiệu nên không dùng.
#   - Phản biện lưu ý: nếu sau này tách đoạn này khỏi s2p3 thì phải thêm câu nói rõ phần lớn retinoid là thuốc.
#   - Câu 'Ở Mỹ, adapalene được bán không cần kê đơn' đã nói rõ phạm vi Mỹ, và s2p3 ngay sau nói NHS (Anh) xếp adapalene vào thuốc cần kê đơn. Hai đoạn này phải đi liền nhau.
[[article.section.paragraph]]
text_vi = "Theo AAD, retinoid bôi làm thông lỗ chân lông, có thể làm sạch mụn đầu đen, đầu trắng và một số nốt mụn, và giúp làm mờ vết thâm sau mụn. Ở Mỹ, adapalene được bán không cần kê đơn. Retinol, loại retinoid hay được thêm vào mỹ phẩm, theo AAD có thể làm thông lỗ chân lông và làm mờ vết thâm."
sources = [
  { url = "https://www.aad.org/public/diseases/acne/derm-treat/treat", quote = "This medication works to clear your pores, and can treat blackheads, whiteheads, and some pimples. If you develop dark spots after acne clears, a retinoid can help lighten these spots." },
  { url = "https://www.aad.org/public/diseases/acne/derm-treat/treat", quote = "Non-prescription retinoid Adapalene (You’ll find acne treatment that contains this retinoid online and in stores.)" },
  { url = "https://dermnetnz.org/topics/topical-retinoids", quote = "Topical retinoids such as retinol and retinaldehyde are commonly added to cosmetics." },
  { url = "https://www.aad.org/public/diseases/acne/diy/skin-color", quote = "Retinol: This can unclog pores and fade dark spots." },
]

# Lưu ý người duyệt (s2p3):
#   - Ở Mỹ adapalene không cần đơn (AAD, s2p2); ở Anh NHS xếp nó vào thuốc kê đơn (câu 'They're used to…' nằm dưới mục 'Treatments from a GP or specialist'). Hai nguồn khác nhau theo nước nên bài nêu cả hai. Tình trạng ở Việt Nam thì không nguồn nào nói.
#   - Câu 'Nhiều retinoid khác là thuốc' là cầu nối; DermNet gọi mọi retinoid bôi là 'medications'.
#   - Nhận xét về kích ứng của DermNet nói về retinoid dạng thuốc, không so sánh với retinol mỹ phẩm.
#   - Đã đọc ngữ cảnh nhs-acne.txt dòng 111: câu 'They're used to: … tretinoin and adapalene' nằm dưới mục 'Treatments from a GP or specialist … with a prescription'. Đúng như bài viết.
[[article.section.paragraph]]
text_vi = "Nhiều retinoid khác là thuốc. DermNet (New Zealand) xếp adapalene, tazarotene, tretinoin và trifarotene vào nhóm retinoid bôi do bác sĩ kê đơn; NHS (Anh) cũng xếp tretinoin và adapalene vào thuốc bôi cần kê đơn. Retinoid có thể gây kích ứng ở một số người; theo DermNet, adapalene ít kích ứng nhất, tretinoin kích ứng nhiều nhất, và dễ kích ứng khi bôi gần mắt hoặc môi."
sources = [
  { url = "https://dermnetnz.org/topics/topical-retinoids", quote = "Prescribed topical retinoids include adapalene, alitretinoin , tazarotene, tretinoin, and trifarotene." },
  { url = "https://www.nhs.uk/conditions/acne/", quote = "There are many acne treatments available from a GP or skin specialist (dermatologist) with a prescription." },
  { url = "https://www.nhs.uk/conditions/acne/", quote = "They're used to: reduce inflammation and oiliness, and prevent spots, such as the retinoid medicines tretinoin and adapalene" },
  { url = "https://www.aad.org/public/diseases/acne/derm-treat/treat", quote = "If you’ve used a retinoid in the past and found that it irritated your skin, let your dermatologist know. This happens to some people." },
  { url = "https://dermnetnz.org/topics/topical-retinoids", quote = "Can be irritating if applied close to the eyes or lips. Adapalene is the least irritating topical retinoid, and tretinoin the most." },
]

# Lưu ý người duyệt (s2p4):
#   - r2, sửa theo phản biện: vế 'phối hợp với cách xử lý khác' giờ đi liền với câu kế tiếp trên trang AAD (aad-acne-treat.txt dòng 660): bác sĩ có thể KÊ một thuốc phối hợp. Đoạn trích thêm dừng ở 'antibiotic.', không có tên thương hiệu. Bài không còn gợi ý tự dùng BPO chồng với sản phẩm khác; khớp với s3p1 và với các luật caution đã bật (retinoid + BPO, BHA + BPO, azelaic acid + BPO cùng buổi).
#   - Câu 'dùng cách ngày' và câu làm bạc vải lấy từ trang AAD cho da màu (skin of color). Việc làm bạc vải không phụ thuộc màu da, nhưng trang chỉ nói điều này trong ngữ cảnh đó.
#   - Khả năng BPO bị phân huỷ thành benzene (trang AAD BPO FAQs) không đưa vào vì dàn ý không có và cần giải thích dài.
#   - Đã đọc aad-acne-treat.txt dòng 660: câu 'For this reason, your dermatologist may prescribe…' đi ngay sau câu 'most effective when used along with…'. Bài giờ gắn ý phối hợp với việc bác sĩ kê đơn, không còn gợi ý tự dùng chồng sản phẩm.
[[article.section.paragraph]]
text_vi = "Benzoyl peroxide làm giảm vi khuẩn gây mụn trên da. Theo AAD, chất này hiệu quả nhất khi phối hợp với cách xử lý khác, vì vậy bác sĩ da liễu có thể kê một thuốc chứa sẵn benzoyl peroxide cùng một thuốc khác như retinoid hoặc kháng sinh. AAD khuyên bắt đầu với loại 2,5% để tránh khô, kích ứng, rát; nếu vẫn kích ứng thì thử dùng cách ngày. Chất này làm bạc màu quần áo, ga giường, vỏ gối và khăn."
sources = [
  { url = "https://www.aad.org/public/diseases/acne/derm-treat/treat", quote = "Benzoyl peroxide: This active ingredient reduces acne-causing bacteria on your skin. It’s most effective when used along with another acne treatment that works on the other causes of acne." },
  { url = "https://www.aad.org/public/diseases/acne/derm-treat/treat", quote = "For this reason, your dermatologist may prescribe a medication that contains benzoyl peroxide and another acne medication like a retinoid or an antibiotic." },
  { url = "https://www.aad.org/public/diseases/acne/diy/adult-acne-treatment", quote = "While you’ll find products that contain up to 10% benzoyl peroxide, it’s best to start with a product that contains 2.5%. That will help you avoid side effects like dry, irritated skin or a burning sensation." },
  { url = "https://www.aad.org/public/diseases/acne/diy/skin-color", quote = "If the 2.5% product irritates your skin, try using it every other day." },
  { url = "https://www.aad.org/public/diseases/acne/diy/skin-color", quote = "However, it will bleach clothing, sheets, pillow cases, and towels." },
]

# Lưu ý người duyệt (s2p5):
#   - Chữ 'BHA' do tôi thêm để khớp với nhóm BHA của app; nguồn không dùng chữ BHA và không có đoạn trích đỡ. Trang AAD treat còn có câu 'It’s effective for treating whiteheads and pimples', hơi khác trang adult ('whiteheads and blackheads'). Bài theo trang adult.
[[article.section.paragraph]]
text_vi = "Salicylic acid đã được dùng cho mụn từ lâu. Theo AAD, chất này làm thông lỗ chân lông bị bít và tẩy tế bào chết, nên hợp nhất với mụn đầu trắng và đầu đen. Salicylic acid có nhiều nồng độ và nhiều dạng, kể cả sữa rửa mặt và kem dưỡng ẩm."
sources = [
  { url = "https://www.aad.org/public/diseases/acne/derm-treat/treat", quote = "Salicylic acid: Used for years to treat acne, salicylic acid opens clogged pores and exfoliates the skin." },
  { url = "https://www.aad.org/public/diseases/acne/diy/adult-acne-treatment", quote = "Salicylic acid: Because it unclogs pores and exfoliates the skin, salicylic acid works best on whiteheads and blackheads." },
  { url = "https://www.aad.org/public/diseases/acne/derm-treat/treat", quote = "You’ll find salicylic acid available in different strengths and in different forms, including cleansers and moisturizers." },
]

# Lưu ý người duyệt (s2p6):
#   - Trên trang AAD treat, azelaic acid nằm trong danh sách thuốc bôi được FDA phê duyệt mà bác sĩ có thể dùng, kèm tên thương hiệu thuốc. Trang adult lại xếp nó vào các hoạt chất bác sĩ gợi ý cho người tự chăm mụn nhẹ đến vừa. Không nguồn nào nói nồng độ trong mỹ phẩm, nên bài không nói azelaic acid mua tự do hay cần đơn.
#   - 'nên dùng được cho nhiều dạng mụn' có nghĩa là 'vì vậy dùng được', không phải lời khuyên dùng. Bài không nói azelaic acid mua tự do hay phải kê đơn, đúng với nguồn.
[[article.section.paragraph]]
text_vi = "Azelaic acid, theo AAD, làm thông lỗ chân lông bị bít và giữ cho chúng thông, tác động lên vi khuẩn gây mụn và giảm viêm do mụn, nên dùng được cho nhiều dạng mụn. Chất này cũng có thể làm mờ vết thâm xuất hiện khi nốt mụn lành."
sources = [
  { url = "https://www.aad.org/public/diseases/acne/derm-treat/treat", quote = "Azelaic acid: This acne treatment opens clogged pores and helps keep them open, works on the bacteria that cause acne, and reduces inflammation due to acne. This makes it an effective treatment for different types of acne." },
  { url = "https://www.aad.org/public/diseases/acne/diy/adult-acne-treatment", quote = "Azelaic acid: It fights acne and can also fade the dark spots that appear when an acne spot clears." },
]

[[article.section]]
heading_vi = "Bắt đầu và dùng đều"

# Lưu ý người duyệt (s3p1):
#   - 'Không thêm sản phẩm khác' trong ngữ cảnh trang là không thêm sản phẩm cho mụn khác; trang không cấm kem dưỡng ẩm hay kem chống nắng (s3p4). Hai trang AAD cho mốc sạch mụn hơi khác nhau: '3 to 4 months' (habits) và '16 weeks' (adult, s3p3).
[[article.section.paragraph]]
text_vi = "AAD khuyên chọn một sản phẩm có hoạt chất hợp với kiểu mụn của mình và dùng đúng hướng dẫn trong 6–8 tuần, không thêm sản phẩm khác, cũng không ngừng giữa chừng. Nếu sau đó vẫn không thấy cải thiện thì có thể thử sản phẩm khác. Sạch mụn hoàn toàn thường mất 3–4 tháng."
sources = [
  { url = "https://www.aad.org/public/diseases/acne/diy/adult-acne-treatment", quote = "When shopping for acne-fighting products, you want to find one product that contains an active ingredient which can effectively treat the type of acne you have. Use that product for 6 to 8 weeks, taking care to use the product as directed on the instructions." },
  { url = "https://www.aad.org/public/diseases/acne/diy/adult-acne-treatment", quote = "During this time, don’t add another product. Don’t stop using the product you started with." },
  { url = "https://www.aad.org/public/diseases/acne/skin-care/habits-stop", quote = "You want to use a product for 6 to 8 weeks. It takes that long to see some improvement. If you don’t see any improvement by then, you can try another product." },
  { url = "https://www.aad.org/public/diseases/acne/skin-care/habits-stop", quote = "Complete clearing generally takes 3 to 4 months." },
]

[[article.section.paragraph]]
text_vi = "AAD khuyên bôi một lớp mỏng lên cả vùng da hay nổi mụn, ví dụ cả trán, mũi và cằm, thay vì chỉ chấm lên từng nốt: chấm lên nốt chỉ xử lý mụn đang thấy, còn bôi cả vùng giúp xử lý mụn hiện có và ngăn đợt mụn tiếp theo."
sources = [
  { url = "https://www.aad.org/public/diseases/acne/diy/adult-acne-treatment", quote = "You want to apply a thin layer of acne medication to the whole area rather than just your acne spots. When you put medication only on the acne you see, you treat what’s there." },
  { url = "https://www.aad.org/public/diseases/acne/diy/adult-acne-treatment", quote = "By applying medication to all your acne-prone skin, you treat the existing acne and prevent the next breakout." },
  { url = "https://www.aad.org/public/diseases/acne/skin-care/habits-stop", quote = "For example, if you tend to breakout on your forehead, nose, and chin, you would want to apply the acne treatment evenly on all of these areas of your face." },
]

# Lưu ý người duyệt (s3p3):
#   - Đoạn trích 4–8 tuần / 16 tuần là danh sách (Fewer breakouts / Clearing) bị nối thành một dòng khi tải trang.
#   - r2, sửa theo phản biện: câu 'mỗi ngày một lần trước khi ngủ' giờ ghi rõ chủ ngữ là retinoid bôi dạng thuốc theo DermNet (trang nêu adapalene, isotretinoin, tretinoin, trifarotene), không nói về retinol mỹ phẩm. Thêm câu AAD về làm theo hướng dẫn của bác sĩ (aad-acne-treat.txt dòng 658, mục 'Dermatologists' tips for using a retinoid').
#   - Đã đọc dermnet-topical-retinoids.txt dòng 134: câu '12 weeks or longer' và câu 'once daily at bedtime' nằm cùng đoạn về retinoid bôi dạng thuốc cho mụn. Bài đã ghi rõ đây là thuốc.
[[article.section.paragraph]]
text_vi = "Theo một bác sĩ da liễu trên trang AAD, nếu sản phẩm hợp với mình, thường sẽ thấy ít mụn hơn sau 4–8 tuần và sạch mụn khoảng 16 tuần. Theo DermNet (New Zealand), các retinoid bôi dạng thuốc như adapalene hay tretinoin được bôi lên mặt mỗi ngày một lần trước khi ngủ, và có thể mất 12 tuần hoặc lâu hơn mới thấy cải thiện. AAD lưu ý làm theo hướng dẫn của bác sĩ da liễu để retinoid phát huy tác dụng tốt nhất."
sources = [
  { url = "https://www.aad.org/public/diseases/acne/diy/adult-acne-treatment", quote = "If the medication works for you, Dr. Harper says you can expect to see: Fewer breakouts: 4 to 8 weeks Clearing: 16 weeks after starting the medication" },
  { url = "https://dermnetnz.org/topics/topical-retinoids", quote = "It may take 12 weeks or longer before improvement is seen." },
  { url = "https://dermnetnz.org/topics/topical-retinoids", quote = "Applied to the face once daily at bedtime, topical retinoids such as adapalene, isotretinoin, tretinoin ( retinoic acid ), and trifarotene can help mild to moderately severe acne ." },
  { url = "https://www.aad.org/public/diseases/acne/derm-treat/treat", quote = "Following your dermatologist’s instructions will help you get the most benefit from a retinoid." },
]

