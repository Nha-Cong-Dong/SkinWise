text_vi = "Theo DermNet (New Zealand), da khô là da sờ thấy khô, xảy ra khi lớp sừng ngoài cùng của da thiếu ẩm, làm bề mặt da có những vết nứt nhỏ. Da khô thường xỉn, sần, có vảy và kém mềm dẻo. Theo AAD (Viện Hàn lâm Da liễu Hoa Kỳ), da khô có thể bong vảy, ngứa, nứt, thậm chí chảy máu."
