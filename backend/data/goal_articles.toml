  { url = "https://www.aad.org/public/diseases/acne/derm-treat/treat", quote = "Azelaic acid can also treat the dark spots that appear when acne clears." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/routine/fade-dark-spots", quote = "Effective treatment for dark spots and patches begins with sunscreen." },
  { url = "https://www.aad.org/public/diseases/acne/diy/skin-color", quote = "See a dermatologist before using any type of chemical peel, microdermabrasion, or laser therapy to treat your acne." },
