  { url = "https://www.aad.org/public/diseases/acne/skin-care/habits-stop", quote = "Resist the temptation to pop or squeeze acne. You want to treat your acne with acne medication. If you have deep or painful acne, seeing a dermatologist is necessary to help clear your acne." },
]

