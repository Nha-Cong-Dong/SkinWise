text_vi = "Theo AAD, mụn to, đau, nằm sâu trong da hoặc để lại sẹo khi lành thì cần gặp bác sĩ da liễu, vì sản phẩm mua ngoài khó xử lý hiệu quả. NHS (Anh) khuyên đi khám khi tự chăm mà không đỡ; khi mụn nhiều, sâu, đau hay để lại sẹo; khi có dấu hiệu nhiễm trùng da như nóng, sưng, đỏ; hoặc khi mụn ảnh hưởng tới tinh thần."
