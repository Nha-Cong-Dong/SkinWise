[[article.section.paragraph]]
text_vi = "Màu da có liên quan. Bài tổng quan trên PMC ghi nhận thâm sau viêm gặp ở mọi lứa tuổi, cả nam lẫn nữ, nhưng có vẻ liên quan trực tiếp tới màu da: phổ biến hơn ở người có màu da sẫm hơn (loại da III–VI). AAD cho biết đốm và mảng thâm là một trong những lý do phổ biến nhất khiến người da sẫm màu đi khám da liễu."
