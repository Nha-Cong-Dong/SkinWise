text_vi = "Cách thử của AAD: bôi sản phẩm ngày hai lần trong 7–10 ngày lên một vùng da nhỏ cỡ đồng xu, ở chỗ không bị cọ hay rửa trôi như mặt trong cánh tay hoặc nếp khuỷu tay. Với sản phẩm thường rửa đi như sữa rửa mặt, chỉ để trên da khoảng 5 phút hoặc theo hướng dẫn. Nếu sau 7–10 ngày da không đỏ, ngứa hay sưng thì có thể dùng. Nếu có phản ứng, rửa nhẹ sản phẩm đi càng sớm càng tốt và không dùng lại."
