text_vi = "Về kem chống nắng, AAD gợi ý để tránh nổi mụn thì tìm loại chứa zinc oxide và titanium dioxide, không dùng loại có hương liệu hoặc dầu. Đồ trang điểm nên là loại không dầu, gốc nước; loại ghi \"matte\" có thể giúp bớt bóng. Luôn tẩy hết trang điểm trước khi ngủ."
