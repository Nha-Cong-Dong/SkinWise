# Tên tiếng Việt cho chức năng thành phần trong danh mục EU 2006 (data/eu_functions_2006.tsv).
# code: tên chức năng trong danh mục EU (chữ hoa). name_vi: nhãn ngắn hiển thị trên giao diện.
# description_vi: dịch sát định nghĩa chính thức bằng tiếng Anh trong eu_functions_2006.tsv, không thêm ý.
