# Sản phẩm mẫu. Bảng thành phần chép NGUYÊN VĂN từ trang chính hãng (source_url), không chép từ trí nhớ.
# Kiểm tra lại với trang nguồn: uv run python -m scripts.verify_products
# slug: khoá ổn định, không đổi sau khi đã seed (routine trên trình duyệt tham chiếu id sản phẩm).
# verification_status: "verified" chỉ khi verify_products đạt và đã có người xem lại.
