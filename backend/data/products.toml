# Sản phẩm mẫu. Bảng thành phần chép NGUYÊN VĂN từ trang chính hãng (source_url), không chép từ trí nhớ.
# Kiểm tra lại với trang nguồn: uv run python -m scripts.verify_products
# slug: khoá ổn định, không đổi sau khi đã seed (routine trên trình duyệt tham chiếu id sản phẩm).
# verification_status: "verified" chỉ khi verify_products đạt và đã có người xem lại.
# application: "rinse_off" (rửa trôi: sữa rửa mặt, mặt nạ rửa đi) | "leave_on" (để lại trên da: toner, serum,
#   kem dưỡng, kem chống nắng), theo định nghĩa của Quy định EU 1223/2009. Hiện chỉ để hiển thị.
# [[product.barcodes]]: mã vạch (EAN/UPC) để GET /barcode/{code} tìm ra sản phẩm mẫu. Mỗi mã chép từ một
#   trang cho thấy đó là mã của sản phẩm này (source_url: "gtin13" trong dữ liệu sản phẩm, ô "Barcode"/"Mã vạch"
#   của nhà bán lẻ chính hãng; trường khác thì có ghi chú ngay trên mã); verify_products kiểm tra mã còn trên trang. Không chép từ trí nhớ, không suy
#   ra theo dãy số, không lấy từ Open Beauty Facts hay trang tra mã vạch. size: cỡ in mã này, như trang nguồn ghi.
#   Mỗi mã chỉ thuộc một sản phẩm.

