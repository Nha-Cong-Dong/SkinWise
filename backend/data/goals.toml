#   - Ngữ cảnh: danh sách thành phần nằm trong mục 'Use a product that can even out your skin tone'. Câu đứng ngay trước là 'You may have success with a product that you can buy without a prescription.', câu ngay sau là 'These ingredients can fade existing dark spots.' Không có câu phủ định, không nằm trong mục lời đồn. Vế 'loại bỏ nguyên nhân + chống nắng trước' có trong câu mở đầu của mục này, và phần giới thiệu cũng đỡ ('Getting rid of hyperpigmentation begins with finding out why...'). Câu 'stop using it' nằm trong danh sách phòng thâm tái phát và nói chung cho mọi sản phẩm; body_vi cũng viết như một lưu ý chung. Câu 'see a dermatologist' nằm ở mục 'How a dermatologist can help'. body_vi đã đưa ý này vào, đúng như mục 9 yêu cầu.
