#   - Ý 'nám dễ quay lại khi ra nắng' dựa trên câu chưa được trích ('It's common for melasma to return when you spend time outdoors without protecting your skin from the sun'), nhưng đoạn trích 'For this reason... getting darker or returning' đã đủ đỡ ý này. Người duyệt có thể thêm câu kia nếu muốn.
