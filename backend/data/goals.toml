#   - Nguồn là AAD, thuộc danh sách nguồn chấp nhận. Bản nháp không có chữ 'trị' hay 'chữa', không nêu tên sản phẩm hay thuốc kê đơn. Có nhắc gặp bác sĩ da liễu đúng như nguồn.
