body_vi = "Một bài tổng quan về tăng sắc tố ở da sẫm màu cho biết niacinamide (cùng arbutin, vitamin C, liquiritin) đã cho thấy lợi ích với các rối loạn sắc tố và thường dễ dung nạp, nhưng còn thiếu nghiên cứu dài hạn chặt chẽ. DermNet cũng ghi nhận niacinamide bôi da cải thiện đốm tăng sắc tố trong nhiều nghiên cứu lâm sàng. Bài tổng quan xếp nhóm này (cosmeceuticals, gồm niacinamide) vào lựa chọn hàng thứ hai, sau hydroquinone và retinoid; các lựa chọn hàng thứ hai có ít bằng chứng hơn hydroquinone."
published = true
reviewed_by = "Vân Anh"
reviewed_at = 2026-10-28
sources = [
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC9165630/", quote = "Agents such as arbutin, ascorbic acid, liquiritin and niacinamide have all shown therapeutic benefits in treating pigmentary disorders in richly pigmented skin." },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC9165630/", quote = "These agents are generally well tolerated; however, more robust long-term studies are lacking." },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC9165630/", quote = "Second-line topical treatments include azelaic acid, cosmeceuticals, topical tranexamic acid, kojic acid and cysteamine (strength of recommendation: B)" },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC9165630/", quote = "These treatment options have less evidence when compared to hydroquinone therapies" },
  { url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC9165630/", quote = "Retinoids including tretinoin 0.1%, adapalene 0.1% or tazarotene 0.1% can also be used as first-line therapy (strength of recommendation: B)" },
  { url = "https://dermnetnz.org/topics/nicotinamide", quote = "In multiple clinical studies, topical nicotinamide improved fine lines and wrinkles , hyperpigmented spots, red blotchiness, and skin sallowness (yellowing) as well as elasticity." },
]

