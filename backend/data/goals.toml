# Lưu ý người duyệt:
#   - URL được gợi ý (skin-care-tips-dermatologists-use, '10 skin care secrets') KHÔNG nói về thêm từng sản phẩm hay thử trước; câu gần nhất chỉ là 'Use skin care products that match your skin's needs.' Không dùng trang này; thay bằng 3 trang AAD khác.
#   - Câu 'one new product at a time' là lời trích một bác sĩ trong thông cáo báo chí về chăm sóc da cho tween/teen, không phải trang hướng dẫn chung cho người lớn; bản thân câu viết chung.
#   - Ý 'dùng quá nhiều sản phẩm dễ kích ứng': nguồn chỉ nói về sản phẩm CHỐNG LÃO HOÁ dùng cùng lúc (trang maximize-anti-aging-products). body_vi giới hạn đúng như vậy.
#   - Hai trang AAD lệch nhau về cách thử: test-skin-care-products nói 7–10 ngày, ngày hai lần, mặt trong cánh tay/khuỷu tay; maximize-anti-aging-products nói mặt trong cẳng tay, ngày hai lần, 4–5 ngày. body_vi dùng 7–10 ngày.
#   - Lượt sửa: thêm câu 'nếu da bị phản ứng...' theo phản biện, body_vi giờ 4 câu nên không cần gộp. Không đưa ý retinol/glycolic châm chích 'normal and temporary' vì trang maximize lại khuyên ngừng sản phẩm gây châm chích (đồng ý với phản biện).
#   - Trang test-skin-care-products ghi 'Last updated: 8/10/21', khá cũ.
#   - check_text.py: cả 8 quote OK trên aad-news-guide.txt, aad-test-products.txt, aad-maximize.txt.
#   - Đã tự chạy check_text.py. aad-news-guide.txt: 2/2 OK. aad-test-products.txt: 5/5 OK. aad-maximize.txt: 1/1 OK.
#   - Ngữ cảnh aad-news-guide (dòng 927): đây là lời BS Marisa Garshick, MD, FAAD trong thông cáo về chăm sóc da cho tween/teen. Bản thân câu viết chung, không giới hạn theo tuổi. Viết 'một bác sĩ da liễu của AAD' tạm chấp nhận được vì bà là FAAD; chính xác hơn là 'một bác sĩ da liễu, thành viên AAD'.
#   - Ngữ cảnh aad-test-products (dòng 595): ngay trước câu 'If you develop a skin reaction, gently wash the product off... don't use it again' trang có câu 'some ingredients, such as retinol and glycolic acid, can irritate your skin, particularly if your skin is sensitive. This is normal and temporary.' Trang aad-maximize thì nói nếu sản phẩm do bác sĩ kê gây châm chích, hãy hỏi bác sĩ trước khi ngừng. body_vi đặt câu 'không dùng lại' trong ngữ cảnh thử sản phẩm mới nên không sai nguồn. Tuy vậy người duyệt nên biết: với retinoid hay thuốc kê đơn, kích ứng nhẹ có thể là bình thường. Có thể thêm vế 'sản phẩm do bác sĩ kê thì hỏi bác sĩ trước khi ngừng' (có trong aad-maximize).
#   - Câu về dùng nhiều sản phẩm cùng lúc đúng là chỉ nói về sản phẩm chống lão hoá (aad-maximize dòng 592), và body_vi đã giới hạn đúng như vậy.
