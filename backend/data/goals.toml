[[item]]
key = "aging-retinoid-vs-retinol"
goal = "aging"
kind = "info"
title_vi = "Retinoid và retinol khác nhau thế nào?"
body_vi = "Retinoid là tên gọi chung cho các chất gốc vitamin A dùng trên da; retinol là một loại retinoid, có trong nhiều mỹ phẩm bán tự do. Một số retinoid khác như tretinoin, tazarotene, trifarotene là thuốc kê đơn, cần bác sĩ. Retinoid có thể gây rát, bong tróc hoặc viêm da kích ứng; retinol và retinaldehyde gây kích ứng ít hơn đáng kể so với tretinoin và tazarotene. Bác sĩ da liễu khuyên bắt đầu bằng loại nhẹ nhất, dùng cách đêm rồi tăng dần, và vì retinoid làm da nhạy nắng hơn, chỉ dùng buổi tối và chống nắng ban ngày. Nếu da kích ứng, thường nên giảm số lần dùng hoặc đổi sang loại nhẹ hơn; nếu đang cân nhắc dùng retinol, có thể hỏi bác sĩ da liễu xem có hợp với da mình không."
