# Lưu ý người duyệt:
#   - Đã tách hai mức theo phản biện: da khô / dị ứng 'có thể không hợp' (probably not good candidates); da đỏ, viêm nhiều 'nên tránh' (should avoid).
#   - Sửa theo phản biện: (1) thêm câu người da khô, dễ dị ứng, da đỏ/viêm nhiều nên hỏi bác sĩ da liễu, kèm 2 quote AAD; (2) thêm lưu ý da sẫm màu (kích ứng có thể để lại vết thâm; bắt đầu chậm và kem dưỡng ẩm giúp hạn chế), kèm 2 quote AAD. Để giữ 5 câu, đã gộp câu 'Retinoid là nhóm chất gốc vitamin A' vào câu về tretinoin. Mọi quote đã chạy lại check_text.py: OK.
#   - AAD viết 'probably not good candidates' (có lẽ không hợp), nên body_vi dùng 'có thể không hợp'. Câu 'da đỏ và viêm nhiều' của Dr. Chapas gắn với rosacea; body_vi không nhắc rosacea.
#   - Trang AAD còn nói người có sẹo mụn vừa/nặng hoặc mụn liên quan nội tiết nên gặp bác sĩ da liễu trước khi dùng retinoid; chưa đưa vào vì thuộc mục tiêu mụn, không phải lão hoá.
#   - Câu 'reduces fine lines and wrinkles' của AAD nói về tretinoin (thuốc kê đơn). Về retinol, AAD chỉ nói 'improve uneven skin tone, pigmentation, and texture', không nói nếp nhăn. Bằng chứng nếp nhăn cho retinol chỉ dựa vào một thử nghiệm (Pierard-Franchimont 1998) được bài tổng quan 2006 nhắc lại; bài cũng ghi retinol yếu hơn tretinoin khoảng 20 lần và 'most of the studies have been carried out in patients presenting with photoaged skin'.
#   - Bài PMC2699641 là bài tổng quan năm 2006, khá cũ; nhãn mỹ phẩm không bắt buộc ghi % retinol (AAD: 'there’s no standard requirement that the percentage of retinol be disclosed on the label or packaging').
#   - AAD nói 'Retinoids should not be used during pregnancy' không kèm chi tiết, không phân biệt retinol mỹ phẩm với thuốc kê đơn. Giữ nguyên mức của nguồn.
