title_vi = "Thêm từng sản phẩm mới một, thử trước khi dùng"
body_vi = "Một bác sĩ da liễu của AAD khuyên mỗi lần chỉ thêm một sản phẩm mới để biết da có chịu được không; với da nhạy cảm, có thể thử một lượng nhỏ trước khi thoa cả mặt. AAD hướng dẫn thử ở một vùng nhỏ như mặt trong cánh tay hoặc khuỷu tay, ngày hai lần trong 7–10 ngày; nếu không bị đỏ, ngứa hay sưng thì có thể dùng. Nếu da bị phản ứng, rửa nhẹ sản phẩm đi càng sớm càng tốt và không dùng lại; phản ứng nặng, chườm mát không đỡ thì có thể cần gặp bác sĩ da liễu. Với sản phẩm chống lão hoá, AAD lưu ý dùng nhiều sản phẩm cùng lúc có thể làm da kích ứng."
