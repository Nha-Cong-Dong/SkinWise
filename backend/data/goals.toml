[[item]]
key = "patch-test-new-products"
goal = "all"
kind = "info"
title_vi = "Thử sản phẩm mới trước khi dùng lên mặt"
body_vi = "AAD khuyên thử sản phẩm trước khi thêm vào routine: thoa một ít lên một vùng nhỏ không bị cọ xát hay rửa trôi (mặt trong cánh tay, chỗ gập khuỷu tay), ngày hai lần trong 7–10 ngày; sản phẩm rửa đi như sữa rửa mặt thì để trên da khoảng 5 phút hoặc theo hướng dẫn. Nếu sau 7–10 ngày da không đỏ, ngứa hay sưng thì có thể dùng. AAD lưu ý một số chất như retinol và glycolic acid có thể làm da kích ứng, nhất là da nhạy cảm; điều này bình thường và tạm thời. Nếu da bị phản ứng, rửa nhẹ sản phẩm đi càng sớm càng tốt và không dùng lại; phản ứng nặng, chườm mát không đỡ thì có thể cần gặp bác sĩ da liễu. Một bác sĩ da liễu thành viên AAD cũng khuyên mỗi lần chỉ thêm một sản phẩm mới để biết da có chịu được không."
published = true
reviewed_by = "Vân Anh"
reviewed_at = 2026-10-28
sources = [
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/prevent-skin-problems/test-skin-care-products", quote = "Before you add a skin care product to your routine, dermatologists recommend testing it." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/prevent-skin-problems/test-skin-care-products", quote = "Apply the product to a test spot twice daily for seven to 10 days." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/prevent-skin-problems/test-skin-care-products", quote = "Choose a quarter-sized spot on your skin where the product won’t be rubbed or washed away, such as the underside of your arm or the bend of your elbow." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/prevent-skin-problems/test-skin-care-products", quote = "If you’re testing something that you would usually wash off, like a cleanser, keep it on your skin for five minutes or as long as the instructions say." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/prevent-skin-problems/test-skin-care-products", quote = "If after seven to 10 days you don’t have a skin reaction , such as red, itchy, or swollen skin, go ahead and use the product." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/prevent-skin-problems/test-skin-care-products", quote = "Keep in mind that some ingredients, such as retinol and glycolic acid, can irritate your skin , particularly if your skin is sensitive. This is normal and temporary." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/prevent-skin-problems/test-skin-care-products", quote = "If you develop a skin reaction, gently wash the product off as soon as possible, and don’t use it again." },
  { url = "https://www.aad.org/public/everyday-care/skin-care-secrets/prevent-skin-problems/test-skin-care-products", quote = "If your reaction to a product is severe and not relieved with cool compresses or petroleum jelly, you may need to see a dermatologist to help manage your symptoms." },
  { url = "https://www.aad.org/news/dermatologist-guide-skincare", quote = "When introducing new products to the skin, it is always best to introduce one new product at a time to ensure your skin can tolerate it" },
]

# Lưu ý người duyệt:
