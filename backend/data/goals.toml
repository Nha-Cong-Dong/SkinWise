#   - Bài Telang 2013 là bài tổng quan tường thuật ngắn trên tạp chí nhỏ (Indian Dermatol Online J), không phải tổng quan hệ thống; các câu về tác dụng bảo vệ UV dựa trên nghiên cứu cũ, phần nhiều đo trong điều kiện thí nghiệm.
#   - Bài nói về L-ascorbic acid (nhóm VITAMIN_C). Dẫn xuất (VITAMIN_C_DERIVATIVE) không được nguồn đỡ cùng mức; bài chỉ nói 'research is being directed to find stable compounds of Vitamin C'. Mục này chỉ nên gắn nhóm VITAMIN_C.
#   - Nguồn dùng chữ 'antioxidant drug' và 'treat'; body_vi tránh chữ 'trị' theo quy tắc.
#   - Đã tự chạy check_text.py trên pmc3673383-vitc.txt và pmc5579659-vitc.txt: cả 5 quote đều OK.
#   - Ngữ cảnh: ý 'không thay được kem chống nắng' có căn cứ ở câu ngay sau quote trong Telang 2013: 'Vit. C does not absorb UV light but exerts an UV-protective effect by neutralizing free radicals'. Số liệu bảo vệ UV trong bài là 'Under laboratory conditions' với vitamin C 10%.
#   - Đã kiểm: Telang 2013 không có chữ 'wrinkle' nào. Pullar 2017 nói 'less than convincing' về các nghiên cứu phần lớn dùng hỗn hợp vitamin C với chất khác. Vì vậy câu 'bằng chứng chưa thuyết phục' khớp với nguồn. Telang có câu 'Clinical studies have shown that the topical use of Vit. C increases collagen production', nhưng câu này không nói về nếp nhăn.
#   - Telang còn ghi tác dụng phụ nhẹ: 'yellowish discoloration of the skin… staining of clothes'. Người duyệt có thể thêm nếu muốn.
