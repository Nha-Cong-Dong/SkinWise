#   - Nhóm: trang chỉ ghi 'Vitamin C' mà không nói dạng nào. Bản nháp gán VITAMIN_C (L-ascorbic acid) và không mở rộng sang VITAMIN_C_DERIVATIVE. Cách gán này thận trọng và hợp lý. Người dùng có sản phẩm chứa dẫn xuất sẽ không thấy mục này, đây là chủ ý.
#   - body_vi không có chữ 'trị'/'chữa', không nêu tên sản phẩm, có dùng 'có thể', không thêm nồng độ hay thời điểm bôi mà nguồn không nói.
#   - Về chữ dùng: body_vi viết 'Viện Da liễu Hoa Kỳ (AAD)', trong khi mục dark-spots-retinoid đã duyệt viết 'Hiệp hội Da liễu Hoa Kỳ (AAD)'. Nên thống nhất một cách gọi; việc này không ảnh hưởng độ chính xác. Tiêu đề 'Vitamin C cho đốm thâm' cũng khác kiểu của các mục cùng mục tiêu ('Retinoid', 'Azelaic acid'), cũng chỉ là chuyện thống nhất cách viết.
