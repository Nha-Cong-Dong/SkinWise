# Lưu ý người duyệt:
#   - Lượt sửa: chỉ đổi title_vi theo phản biện (tiêu đề cũ nói chung cho 'da dễ kích ứng', nguồn chỉ nói về rosacea). body_vi và đoạn trích giữ nguyên; check_text.py OK lại cả 5 đoạn trên _workspace/goals/pages/aad-rosacea-tips.txt (danh sách kiểm: _workspace/goals/check/r3-tips.txt).
#   - Trang nói về da bị ROSACEA, không phải 'da đỏ / dễ kích ứng' nói chung. Trang có câu 'Rosacea often makes skin sensitive and easily irritated', nhưng không nói danh sách này áp dụng cho mọi người da nhạy cảm.
#   - 'Alcohol' trên trang không nói rõ loại nào; trang KHÔNG phân biệt cồn khô (ethanol, alcohol denat.) với cồn béo (cetyl/cetearyl alcohol). body_vi giữ nguyên chữ 'cồn (alcohol)' như nguồn. Người đọc có thể né cả cồn béo; muốn tách hai loại thì cần nguồn khác.
#   - Glycolic acid và lactic acid là AHA, nhưng trang chỉ nêu hai chất này, không nói cả nhóm AHA hay BHA/PHA. Không nên mở rộng thành 'tránh mọi acid tẩy da chết' dựa trên câu này.
#   - Đoạn trích thứ hai dài vì là câu dẫn + danh sách; từng mục trong danh sách là từ đơn nên tự nó không đỡ được khẳng định.
#   - Tên 'long não' cho camphor là dịch của tôi, không có trên trang.
