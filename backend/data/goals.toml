# Lưu ý người duyệt:
#   - Sửa theo phản biện: đổi 'sản phẩm trị mụn' thành 'sản phẩm cho mụn'; trích thêm câu 'Store products that contain benzoyl peroxide according to instructions on the package.'
#   - Chủ đề nhạy cảm, có thể thay đổi: trang cập nhật 3/25/25 và nói AAD sẽ tiếp tục cập nhật; trang dựa vào đợt FDA kiểm 95 sản phẩm tháng 3/2025. Người duyệt nên đọc lại trang trước khi bật.
#   - Các khuyến nghị bảo quản / thay sau 10–12 tuần chỉ áp dụng 'If you are concerned'; body giữ điều kiện 'Nếu lo ngại'.
#   - Trang nhắc kết quả JAAD: dùng BPO đều đặn không liên quan đến benzene máu cao hơn hay nguy cơ ung thư cao hơn; body không nêu, người duyệt có thể thêm. Trang khuyên vứt sản phẩm đã gặp nhiệt độ trên 78°F (~26°C), thấp hơn nhiệt độ phòng thường gặp ở Việt Nam; body không nhắc.
#   - Đã kiểm lại 7/7 đoạn trích: OK.
#   - Tôi tự kiểm lại: 7/7 đoạn trích OK.
#   - Ngữ cảnh (dòng 593): các khuyến nghị bảo quản và thay sản phẩm sau 10–12 tuần nằm sau câu 'If you are concerned about using a product that contains benzoyl peroxide, the AAD recommends the following'. Body giữ đúng điều kiện 'Nếu lo ngại'. Cùng danh sách có 'Throw out products exposed to higher temperatures (e.g., greater than 78°F)'. Ngưỡng này (~26°C) rất đáng lưu ý với khí hậu Việt Nam, nên người duyệt nên cân nhắc thêm vào body.
#   - Câu 'Options include adapalene, salicylic acid, or azelaic acid' có điều kiện 'If you are treating acne on your own and have concerns about benzoyl peroxide products'. Body viết 'nếu lo ngại': khớp.
#   - Trang có thể đổi (AAD ghi sẽ cập nhật). Người duyệt nên đọc lại trang trước khi bật.
#   - URL aad-bpo-faqs chưa có khối [[source]].
[[item]]
key = "acne-bpo-benzene"
goal = "acne"
kind = "info"
title_vi = "Benzoyl peroxide và benzene"
body_vi = "Benzene không phải thành phần cố ý thêm vào, nhưng benzoyl peroxide có thể phân huỷ thành benzene, nhất là khi gặp nhiệt độ cao hoặc để lâu. AAD cho biết đến nay chưa có bằng chứng rõ ràng rằng sản phẩm cho mụn chứa benzoyl peroxide có lượng benzene nguy hiểm, nhưng nghiên cứu về vấn đề này còn hạn chế. Nếu lo ngại, AAD khuyên bảo quản theo hướng dẫn trên bao bì và thay sản phẩm sau 10–12 tuần; hoặc cân nhắc hoạt chất khác như adapalene, salicylic acid, azelaic acid."
published = true
reviewed_by = "Vân Anh"
reviewed_at = 2026-10-28
sources = [
  { url = "https://www.aad.org/public/diseases/a-z/benzoyl-peroxide-faqs", quote = "Benzene is not an intended ingredient." },
  { url = "https://www.aad.org/public/diseases/a-z/benzoyl-peroxide-faqs", quote = "Benzoyl peroxide can break down into benzene, especially when: Exposed to high temperatures Stored (remains in a container) for a long time" },
  { url = "https://www.aad.org/public/diseases/a-z/benzoyl-peroxide-faqs", quote = "Keep in mind that to date, there is no clear evidence that acne products containing benzoyl peroxide have dangerous levels of benzene." },
  { url = "https://www.aad.org/public/diseases/a-z/benzoyl-peroxide-faqs", quote = "Current research on this topic is limited." },
  { url = "https://www.aad.org/public/diseases/a-z/benzoyl-peroxide-faqs", quote = "Store products that contain benzoyl peroxide according to instructions on the package." },
  { url = "https://www.aad.org/public/diseases/a-z/benzoyl-peroxide-faqs", quote = "Replace products that contain benzoyl peroxide every 10-12 weeks." },
  { url = "https://www.aad.org/public/diseases/a-z/benzoyl-peroxide-faqs", quote = "Options include adapalene, salicylic acid, or azelaic acid." },
