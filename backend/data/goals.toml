# Lưu ý người duyệt:
#   - Nguồn chỉ nói về salicylic acid và chỉ ở dạng SỮA RỬA MẶT (rửa trôi). Nhóm BHA trong dữ liệu có thể gồm chất khác; trang không nói gì về sản phẩm để lại trên da (toner, serum BHA).
#   - Ngữ cảnh là mục 'Treat acne': salicylic acid được nêu cho lỗ chân lông bị tắc do mụn, không phải cho mọi trường hợp lỗ chân lông to (vd. do da chảy xệ). body_vi giữ ý 'lỗ chân lông bị tắc'.
#   - Trang cũng viết 'Many people who have acne need more than salicylic acne to control their acne' (lỗi chính tả 'acne' trên trang), nên không trích câu này; ý: nhiều người bị mụn cần nhiều hơn salicylic acid.
#   - Trang có danh sách tài liệu tham khảo là sách (Kunin 2005, Leffell 2000), không phải nghiên cứu cụ thể cho câu 'Studies show'.
#   - Đã tự kiểm: check_text.py trên _workspace/goals/pages/aad-large-pores.txt (15154 byte, đúng trang AAD, không phải trang chặn bot) cho 4 đoạn trích và câu ngữ cảnh 'Use a mild, non-comedogenic cleanser when you wake up and the salicylic acid cleanser before bed.': tất cả OK.
#   - Ngữ cảnh: cả 4 câu nằm liền nhau trong mục 'Treat acne'. Không có câu phủ định nào theo sau. Câu kế tiếp là 'Many people who have acne need more than salicylic acne to control their acne.' (lỗi chính tả có sẵn trên trang). body_vi giữ đúng ý 'lỗ chân lông bị tắc do mụn'.
#   - Nhóm BHA trong functional_groups.toml là 'chủ yếu là salicylic acid và các dẫn xuất', nên khớp với chất mà nguồn nói. Nguồn chỉ nói về sữa rửa mặt (rửa trôi), bản nháp đã ghi điều này.
#   - Lệch nhỏ, không chặn: trang ghi buổi sáng dùng sữa rửa mặt 'mild, non-comedogenic', còn body_vi chỉ viết 'dịu nhẹ'. Có thể thêm 'không gây bít tắc lỗ chân lông' cho sát nguồn.
#   - Trang AAD về da dầu (aad-oily-skin.txt) có câu 'Ingredients like salicylic acid, glycolic acid, and lactic acid can help reduce oiliness, but they may be too harsh for your skin. Stop using the product, or use it less often, if your skin becomes irritated.' (đã có trên trang). Câu này có thể dùng làm nguồn thứ hai cho ý giảm dầu kèm lưu ý kích ứng.
