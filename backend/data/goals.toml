# Lưu ý người duyệt:
#   - Sửa theo phản biện: thêm đoạn trích về chống nắng (AAD treat); câu mang thai viết lại theo 'Some topical retinoids are contraindicated for use in pregnancy' (DermNet) và câu AAD adult-acne. Đã bỏ đoạn trích DermNet 'women of childbearing age must use effective contraception...' vì body không nói ý đó. Nguồn DermNet nói mạnh hơn: phụ nữ trong độ tuổi sinh đẻ phải tránh thai hiệu quả khi dùng retinoid (đoạn về retinoid thuốc, check_text OK); người duyệt có thể muốn thêm lại.
#   - Câu AAD về mang thai nói chung về việc tự xử lý mụn, không nói riêng retinoid.
#   - 'Không cần đơn' là tình trạng ở Mỹ; DermNet (NZ) xếp adapalene vào 'Prescribed topical retinoids'. Nguồn không nói gì về tình trạng pháp lý của adapalene ở Việt Nam.
#   - Nhóm RETINOID của SkinWise gồm cả retinol mỹ phẩm. AAD treat và DermNet nói về retinoid thuốc; chỉ trang AAD skin-color nói retinol 'can unclog pores and fade dark spots'. Nguồn không so sánh hiệu quả retinol với adapalene.
#   - Mốc 12 tuần của DermNet nói về retinoid thuốc bôi lúc đi ngủ, không nói riêng về retinol.
#   - Đã kiểm lại 9/9 đoạn trích bằng check_text.py: OK.
#   - Tôi tự kiểm lại: 9/9 đoạn trích OK bằng check_text.py trên _workspace/goals/pages/aad-acne-treat.txt, aad-adult-acne.txt, aad-acne-skin-color.txt, dermnet-topical-retinoids.txt (danh sách đoạn trích ở _workspace/goals/critic-acne/).
#   - Ngữ cảnh: các câu của AAD treat nằm trong mục 'topical medications, all approved by the U.S. FDA, that dermatologists may include in an acne treatment plan'. Đây là retinoid dạng thuốc. Body câu 1 viết 'Retinoid bôi da' cho cả nhóm RETINOID (gồm retinol mỹ phẩm). Ý cho retinol chỉ có trang AAD skin-color đỡ ('Retinol: This can unclog pores and fade dark spots', trong mẹo cho mụn nhẹ ở da màu). Bản nháp đã ghi giới hạn này trong notes.
#   - DermNet dòng 178 'Some topical retinoids are contraindicated for use in pregnancy' nằm trong mục Contraindications. Dòng 230 ghi rủi ro đặc biệt với tazarotene. Body không nói quá.
#   - Trang AAD skin-color nhắc tên thương hiệu (Differin). Body không nhắc tên thương hiệu nào: đạt.
#   - URL aad-adult-acne và aad-acne-skin-color chưa có khối [[source]] trong rules.toml hay goals.toml. goals.py sẽ báo lỗi 'has no [[source]] block' khi seed nếu không kèm new_source_blocks. Bản nháp tôi nhận không có trường này.
[[item]]
key = "acne-retinoid"
goal = "acne"
kind = "active"
group = "RETINOID"
title_vi = "Retinoid (vd. adapalene, retinol)"
body_vi = "Retinoid bôi da có thể giúp thông lỗ chân lông, giảm mụn đầu đen, mụn đầu trắng và một số mụn viêm, đồng thời có thể làm mờ thâm sau mụn. Adapalene là retinoid mua được không cần đơn ở Mỹ; tretinoin, tazarotene, trifarotene là thuốc kê đơn, cần bác sĩ. Bác sĩ da liễu thường khuyên bôi retinoid vào buổi tối và bảo vệ da khỏi nắng trong thời gian dùng. Có thể mất 12 tuần hoặc lâu hơn mới thấy cải thiện. Một số retinoid bôi không được dùng khi mang thai; người đang hoặc muốn mang thai nên hỏi bác sĩ da liễu trước khi dùng."
published = true
reviewed_by = "Vân Anh"
reviewed_at = 2026-10-28
sources = [
  { url = "https://www.aad.org/public/diseases/acne/derm-treat/treat", quote = "Retinoid you apply to your skin: This medication works to clear your pores, and can treat blackheads, whiteheads, and some pimples." },
  { url = "https://www.aad.org/public/diseases/acne/derm-treat/treat", quote = "If you develop dark spots after acne clears, a retinoid can help lighten these spots." },
  { url = "https://www.aad.org/public/diseases/acne/derm-treat/treat", quote = "Non-prescription retinoid Adapalene (You’ll find acne treatment that contains this retinoid online and in stores.)" },
  { url = "https://www.aad.org/public/diseases/acne/derm-treat/treat", quote = "These instructions include protecting your skin from the sun while using a retinoid and applying this medication as directed." },
  { url = "https://www.aad.org/public/diseases/acne/derm-treat/treat", quote = "For example, dermatologists often recommend applying a topical retinoid in the evening." },
  { url = "https://dermnetnz.org/topics/topical-retinoids", quote = "It may take 12 weeks or longer before improvement is seen." },
  { url = "https://dermnetnz.org/topics/topical-retinoids", quote = "Some topical retinoids are contraindicated for use in pregnancy" },
  { url = "https://www.aad.org/public/diseases/acne/diy/adult-acne-treatment", quote = "If you’re pregnant or trying to get pregnant, consult a dermatologist before treating acne on your own." },
  { url = "https://www.aad.org/public/diseases/acne/diy/skin-color", quote = "Retinol: This can unclog pores and fade dark spots." },
