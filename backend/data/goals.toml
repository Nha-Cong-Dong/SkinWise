#   - Trang DermNet cập nhật 7/2021. AAD treat (6/2024) nói 'at least 6 to 8 weeks' để bắt đầu thấy ít mụn hơn (cho mọi phác đồ); hai mốc không mâu thuẫn.
#   - Ý chống nắng trùng một phần với luật usage 'retinoid-sun-sensitivity' đã có.
#   - Đã kiểm lại 6/6 đoạn trích: OK.
