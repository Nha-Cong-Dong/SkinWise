#   - Ý 'kiên nhẫn' chỉ được đỡ gián tiếp: 'dark spots ... can last much longer than the acne'. Body diễn đạt là 'thâm có thể kéo dài lâu hơn mụn', không khuyên thời gian cụ thể.
#   - Câu 'nặn mụn tăng nguy cơ sẹo' nằm trong một khung riêng ('Do not pop pimples') chứ không trong thân mẹo; vẫn là chữ của trang.
#   - AAD gộp người gốc châu Á vào 'skin of color'; không có nghĩa mọi người châu Á đều có da sẫm màu. Title dùng 'da sẫm màu'.
#   - 7/7 đoạn trích OK trên aad-acne-skin-color.txt (và bản -full). Ngữ cảnh đúng: mẹo 1, khung 'Do not pop pimples', mẹo 7, mẹo 9.
