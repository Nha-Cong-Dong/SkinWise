[[goal]]
code = "acne"
name_vi = "Da dễ nổi mụn"
description_vi = "Da hay nổi mụn đầu đen, mụn đầu trắng hoặc mụn viêm. Mục này gom các nhóm hoạt chất bôi da mà nguồn da liễu hay nhắc tới cho mụn, kèm lưu ý khi dùng. Đây không phải lời khuyên y khoa."
position = 1

[[goal]]
code = "aging"
name_vi = "Dấu hiệu lão hoá"
description_vi = "Nếp nhăn nhỏ, da kém săn hoặc đốm nâu. Mục này gom các nhóm hoạt chất bôi da mà nguồn da liễu hay nhắc tới cho các dấu hiệu này, kèm lưu ý khi dùng."
position = 2

[[goal]]
code = "dark-spots"
name_vi = "Thâm và không đều màu"
description_vi = "Đốm thâm, mảng sẫm màu hoặc da không đều màu, ví dụ vết thâm sau mụn, nám hoặc đốm nâu. Mục này gom các nhóm hoạt chất mà nguồn da liễu nhắc tới, kèm lưu ý khi dùng."
position = 3

[[goal]]
code = "dry-sensitive"
name_vi = "Da khô / nhạy cảm"
description_vi = "Dành cho da hay khô, căng, bong tróc hoặc dễ châm chích, ửng đỏ khi dùng sản phẩm mới. Các thẻ dưới đây tóm tắt thói quen chăm sóc và cách chọn sản phẩm theo khuyến nghị của các nguồn y khoa."
position = 4

[[goal]]
code = "oily-pores"
name_vi = "Da dầu / lỗ chân lông to"
description_vi = "Da nhanh bóng dầu hoặc lỗ chân lông dễ thấy. Mục này gom các nhóm hoạt chất và thói quen chăm da mà nguồn da liễu nhắc tới, kèm lưu ý khi dùng."
position = 5

[[goal]]
code = "redness"
name_vi = "Da đỏ / dễ kích ứng"
description_vi = "Da hay ửng đỏ, châm chích hoặc rát khi dùng sản phẩm. Mục này gom các lưu ý chọn sản phẩm và chăm sóc nhẹ nhàng mà nguồn da liễu nhắc tới. Đây không phải lời khuyên y khoa."
position = 6

[[goal]]
code = "all"
name_vi = "Dùng chung"
description_vi = "Thông tin dùng chung cho mọi mục tiêu: chống nắng."
position = 7

