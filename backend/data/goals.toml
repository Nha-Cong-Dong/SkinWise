[[item]]
key = "redness-avoid-ingredients"
goal = "redness"
kind = "info"
title_vi = "Da bị rosacea: thành phần bác sĩ da liễu khuyên tránh"
body_vi = "Với da bị rosacea (bệnh da làm mặt hay đỏ), nhiều sản phẩm chăm da và mỹ phẩm có thể gây kích ứng. Để giảm nguy cơ đó, bác sĩ da liễu khuyên tránh sản phẩm có một trong các thành phần: cồn (alcohol), long não (camphor), hương liệu, glycolic acid, lactic acid, menthol, sodium lauryl sulfate và urea. Nên chọn sản phẩm không hương liệu (ghi \"fragrance-free\", không phải chỉ ghi \"unscented\"), có ghi dành cho da nhạy cảm và không gây bít lỗ chân lông (non-comedogenic). Nên thử sản phẩm trước khi bôi lên mặt."
published = true
reviewed_by = "Vân Anh"
reviewed_at = 2026-10-28
sources = [
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "When you have rosacea, many skin care products and cosmetics can irritate your skin." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "To reduce the likelihood of using a product that will irritate your skin, dermatologists recommend that you avoid products that contain any of the following ingredients: Alcohol Camphor Fragrance Glycolic acid Lactic acid Menthol Sodium lauryl sulfate (often found in shampoos and toothpaste) Urea" },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "To reduce the likelihood of a product irritating your skin, choose fragrance-free (rather than unscented) products." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Select products that say they are made for sensitive skin and non-comedogenic (won’t clog pores)." },
  { url = "https://www.aad.org/public/diseases/rosacea/triggers/tips", quote = "Test skin care products and makeup before applying them to your face." },
]

