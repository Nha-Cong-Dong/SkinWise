#   - Trang chỉ ghi 'Vitamin C' chung chung, không nói dạng nào (L-ascorbic acid hay dẫn xuất). Mục gán nhóm VITAMIN_C (theo functional_groups.toml là ascorbic acid nguyên chất); dự án còn nhóm riêng VITAMIN_C_DERIVATIVE. Nguồn không cho biết dẫn xuất có tác dụng tương tự hay không, nên không mở rộng sang nhóm đó.
#   - Bài viết cho người có màu da trung bình đến sẫm ('darker skin tones'); body_vi đã nói rõ điều này. Nguồn không nói gì về da sáng màu.
#   - Nguồn KHÔNG nói: nồng độ vitamin C, bôi buổi sáng hay tối, bao lâu thì thấy kết quả (mốc 6–12 tháng trên trang là thời gian thâm tự mờ sau khi bỏ nguyên nhân, không phải thời gian tác dụng của vitamin C). Vì vậy body_vi không đưa các ý này.
