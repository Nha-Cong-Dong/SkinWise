#   - DermNet nói 'mild to moderately severe acne'. Body viết 'mụn nhẹ đến vừa': không nói quá.
#   - Có trùng ý với acne-retinoid (12 tuần, buổi tối, chống nắng). Người duyệt có thể gộp hai mục.
[[item]]
key = "acne-retinoid-patience"
goal = "acne"
kind = "info"
title_vi = "Retinoid dạng thuốc cho mụn: dùng buổi tối và kiên nhẫn"
body_vi = "Retinoid dạng thuốc bôi (như adapalene, tretinoin, trifarotene; nhiều loại cần bác sĩ kê) thường được bôi lên mặt mỗi ngày một lần vào giờ đi ngủ và có thể giúp mụn nhẹ đến vừa. Có thể mất 12 tuần hoặc lâu hơn mới thấy cải thiện. Ban ngày nên dùng kem chống nắng / dưỡng ẩm để bớt nhạy cảm với nắng và khô da. Với mụn nặng, nhất là mụn mủ kèm nốt sâu và nang, retinoid bôi không nên dùng một mình; mụn to, đau, nằm sâu thì cần gặp bác sĩ da liễu. Nguồn này nói về retinoid dạng thuốc, không nói về retinol trong mỹ phẩm."
published = true
reviewed_by = "Vân Anh"
reviewed_at = 2026-10-28
sources = [
  { url = "https://dermnetnz.org/topics/topical-retinoids", quote = "Prescribed topical retinoids include adapalene, alitretinoin , tazarotene, tretinoin, and trifarotene." },
  { url = "https://dermnetnz.org/topics/topical-retinoids", quote = "Applied to the face once daily at bedtime, topical retinoids such as adapalene, isotretinoin, tretinoin ( retinoic acid ), and trifarotene can help mild to moderately severe acne ." },
  { url = "https://dermnetnz.org/topics/topical-retinoids", quote = "They are effective first-line treatment for comedonal and inflammatory acne, but are not recommended as monotherapy for severe acne, especially if there are pustules with deep nodules and cysts." },
  { url = "https://dermnetnz.org/topics/topical-retinoids", quote = "It may take 12 weeks or longer before improvement is seen." },
  { url = "https://dermnetnz.org/topics/topical-retinoids", quote = "The regular application of a sunscreen / moisturiser combination during the day will protect against the sun sensitivity and dryness." },
  { url = "https://www.aad.org/public/diseases/acne/diy/adult-acne-treatment", quote = "If you have large, painful pimples that sit deep in your skin or acne that leaves a scar when it clears, you’ll need to see a dermatologist for treatment." },
]

