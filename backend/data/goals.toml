#   - check_text.py: cả 6 quote OK trên _workspace/goals/pages/aad-dry-tips.txt.
#   - Đã tự chạy check_text.py trên _workspace/goals/pages/aad-dry-tips.txt (trang 'Dermatologists' top tips for relieving dry skin', file 17,6 KB, đúng trang thật, không phải trang chặn bot). Cả 6 quote đều OK.
#   - Đã đọc ngữ cảnh (dòng 595 và 627): các mẹo nằm trong danh sách 'These tips from board-certified dermatologists can help you heal excessively dry skin at home'. Không có phủ định, không phải mục lời đồn. Câu 'gặp bác sĩ' đi ngay trước câu 'Your overly dry skin may be due to an underlying medical condition, such as atopic dermatitis, psoriasis, or kidney disease', nên ý 'có thể do một bệnh khác' trong body_vi có căn cứ.
